<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="statsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Progress Bar Gradient 1 -->
    <linearGradient id="barGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Progress Bar Gradient 2 -->
    <linearGradient id="barGradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Rank Glow -->
    <filter id="rankGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .header-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #F8FAFC;
      letter-spacing: 1px;
    }
    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #94A3B8;
    }
    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #00E5FF;
    }
    .rank-title {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 900;
      fill: #FF3CAC;
    }
    .rank-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #8B5CF6;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .anim-bar-1 { animation: growBar1 2s ease-out forwards; }
    .anim-bar-2 { animation: growBar2 2s ease-out forwards; }
    .anim-bar-3 { animation: growBar3 2s ease-out forwards; }
    .anim-bar-4 { animation: growBar4 2s ease-out forwards; }

    @keyframes growBar1 { from { width: 0; } to { width: 210px; } }
    @keyframes growBar2 { from { width: 0; } to { width: 175px; } }
    @keyframes growBar3 { from { width: 0; } to { width: 190px; } }
    @keyframes growBar4 { from { width: 0; } to { width: 155px; } }

    .pulse-ring {
      animation: ringPulse 3s ease-in-out infinite alternate;
    }
    @keyframes ringPulse {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 15; }
    }
  </style>

  <!-- Main Container Panel -->
  <rect x="2" y="2" width="496" height="236" rx="16" fill="url(#statsBg)" stroke="url(#statsBorder)" stroke-width="1.5"/>

  <!-- Top Terminal Header Bar -->
  <g transform="translate(20, 28)">
    <circle cx="0" cy="0" r="4" fill="#FF3CAC"/>
    <circle cx="12" cy="0" r="4" fill="#8B5CF6"/>
    <circle cx="24" cy="0" r="4" fill="#00E5FF"/>
    <text x="38" y="4" class="header-title">SYSTEM ANALYTICS // GITHUB METRICS</text>
  </g>

  <!-- Left Stats Progress Rows -->
  <g transform="translate(20, 60)">
    <!-- Metric 1: Total Commits -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" class="stat-label">Total Commits (2026)</text>
      <text x="240" y="12" class="stat-value" text-anchor="end">1,240+</text>
      <rect x="0" y="20" width="240" height="8" rx="4" fill="#1E293B"/>
      <rect class="anim-bar-1" x="0" y="20" width="210" height="8" rx="4" fill="url(#barGradCyan)"/>
    </g>

    <!-- Metric 2: Pull Requests & Issues -->
    <g transform="translate(0, 42)">
      <text x="0" y="12" class="stat-label">Pull Requests &amp; Reviews</text>
      <text x="240" y="12" class="stat-value" text-anchor="end">180+</text>
      <rect x="0" y="20" width="240" height="8" rx="4" fill="#1E293B"/>
      <rect class="anim-bar-2" x="0" y="20" width="175" height="8" rx="4" fill="url(#barGradPurple)"/>
    </g>

    <!-- Metric 3: AI Code Contributions -->
    <g transform="translate(0, 84)">
      <text x="0" y="12" class="stat-label">AI &amp; Agentic Pipelines</text>
      <text x="240" y="12" class="stat-value" text-anchor="end">99.4%</text>
      <rect x="0" y="20" width="240" height="8" rx="4" fill="#1E293B"/>
      <rect class="anim-bar-3" x="0" y="20" width="190" height="8" rx="4" fill="url(#barGradCyan)"/>
    </g>

    <!-- Metric 4: Repository Stars & Impact -->
    <g transform="translate(0, 126)">
      <text x="0" y="12" class="stat-label">Project Stars &amp; Repos</text>
      <text x="240" y="12" class="stat-value" text-anchor="end">Top 1%</text>
      <rect x="0" y="20" width="240" height="8" rx="4" fill="#1E293B"/>
      <rect class="anim-bar-4" x="0" y="20" width="155" height="8" rx="4" fill="url(#barGradPurple)"/>
    </g>
  </g>

  <!-- Right Rank Indicator Ring -->
  <g transform="translate(380, 135)">
    <!-- Outer Track -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#1E293B" stroke-width="8"/>
    <!-- Animated Arc -->
    <circle class="pulse-ring" cx="0" cy="0" r="54" fill="none" stroke="url(#statsBorder)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339" stroke-dashoffset="40" transform="rotate(-90)" filter="url(#rankGlow)"/>
    
    <text x="0" y="8" class="rank-title" text-anchor="middle" filter="url(#rankGlow)">S+</text>
    <text x="0" y="26" class="rank-sub" text-anchor="middle">RANK: ELITE</text>
  </g>
</svg>
