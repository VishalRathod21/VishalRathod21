<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(10, 18, 36, 0.85)"/>
      <stop offset="100%" stop-color="rgba(4, 7, 14, 0.95)"/>
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#B28DFF"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B28DFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(178, 141, 255, 0.1)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    text {{ font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }}
    .mono {{ font-family: 'Fira Code', Consolas, Monaco, monospace; }}

    .ring-circle {{
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      animation: fillRing 2.5s ease-out forwards;
    }}
    @keyframes fillRing {{
      to {{ stroke-dashoffset: 65; }}
    }}

    .bar-python {{ animation: slidePy 2s ease-out forwards; }}
    @keyframes slidePy {{ from {{ width: 0px; }} to {{ width: 340px; }} }}

    .bar-cpp {{ animation: slideCpp 2s 0.2s ease-out forwards; }}
    @keyframes slideCpp {{ from {{ width: 0px; }} to {{ width: 140px; }} }}

    .bar-sql {{ animation: slideSql 2s 0.4s ease-out forwards; }}
    @keyframes slideSql {{ from {{ width: 0px; }} to {{ width: 90px; }} }}

    .bar-js {{ animation: slideJs 2s 0.6s ease-out forwards; }}
    @keyframes slideJs {{ from {{ width: 0px; }} to {{ width: 60px; }} }}

    .pulse-rank {{
      animation: rankPulse 2s infinite alternate;
    }}
    @keyframes rankPulse {{
      0% {{ filter: brightness(1); }}
      100% {{ filter: brightness(1.25); }}
    }}
  </style>

  <!-- Container -->
  <rect width="1200" height="520" rx="28" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <rect x="-90" y="-22" width="180" height="26" rx="13" fill="rgba(124, 92, 255, 0.08)" stroke="rgba(124, 92, 255, 0.3)" stroke-width="1"/>
    <text x="0" y="-5" fill="#7C5CFF" font-size="10" font-weight="800" letter-spacing="2">REAL-TIME ANALYTICS</text>
    <text x="0" y="24" fill="#F8FAFC" font-size="28" font-weight="900" letter-spacing="2">AI ENGINEER DASHBOARD</text>
  </g>

  <!-- LEFT PANEL: STATS & METRICS GRID -->
  <g transform="translate(40, 110)">
    <rect width="540" height="370" rx="20" fill="url(#card-glass)" stroke="url(#card-border)" stroke-width="1.5"/>
    <rect x="1" y="1" width="538" height="368" rx="19" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- Panel Title -->
    <text x="24" y="34" fill="#F8FAFC" font-size="18" font-weight="800">Telemetry &amp; Contribution Overview</text>
    <text x="24" y="52" fill="#94A3B8" font-size="11" font-weight="600">LIVE SYSTEM METRICS</text>
    <line x1="24" y1="66" x2="516" y2="66" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Stat Grid Items -->
    <g transform="translate(24, 85)">
      <!-- Repositories -->
      <g transform="translate(0, 0)">
        <rect width="236" height="70" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(79, 140, 255, 0.2)" stroke-width="1"/>
        <text x="16" y="26" fill="#94A3B8" font-size="12" font-weight="600">Total Repositories</text>
        <text x="16" y="54" fill="#F8FAFC" font-size="24" font-weight="900" class="mono">38+</text>
        <circle cx="206" cy="35" r="14" fill="rgba(79, 140, 255, 0.1)"/>
        <path d="M 200,35 L 212,35 M 206,29 L 206,41" stroke="#4F8CFF" stroke-width="2"/>
      </g>

      <!-- Total Commits -->
      <g transform="translate(256, 0)">
        <rect width="236" height="70" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(124, 92, 255, 0.2)" stroke-width="1"/>
        <text x="16" y="26" fill="#94A3B8" font-size="12" font-weight="600">Total Commits (2026)</text>
        <text x="16" y="54" fill="#B28DFF" font-size="24" font-weight="900" class="mono">1,420+</text>
        <circle cx="206" cy="35" r="14" fill="rgba(124, 92, 255, 0.1)"/>
        <polyline points="199,35 204,40 213,30" fill="none" stroke="#B28DFF" stroke-width="2"/>
      </g>

      <!-- Stars Earned -->
      <g transform="translate(0, 86)">
        <rect width="236" height="70" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(178, 141, 255, 0.2)" stroke-width="1"/>
        <text x="16" y="26" fill="#94A3B8" font-size="12" font-weight="600">Stars Earned</text>
        <text x="16" y="54" fill="#4F8CFF" font-size="24" font-weight="900" class="mono">240+</text>
        <polygon points="206,26 209,33 216,33 210,38 212,45 206,40 200,45 202,38 196,33 203,33" fill="#4F8CFF"/>
      </g>

      <!-- Followers -->
      <g transform="translate(256, 86)">
        <rect width="236" height="70" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(79, 140, 255, 0.2)" stroke-width="1"/>
        <text x="16" y="26" fill="#94A3B8" font-size="12" font-weight="600">Network Followers</text>
        <text x="16" y="54" fill="#F8FAFC" font-size="24" font-weight="900" class="mono">185+</text>
        <circle cx="206" cy="31" r="5" fill="#7C5CFF"/>
        <path d="M 196,44 C 196,38 216,38 216,44" fill="none" stroke="#7C5CFF" stroke-width="2"/>
      </g>
    </g>

    <!-- Rank & Commitment Status Banner -->
    <g transform="translate(24, 275)">
      <g class="pulse-rank">
        <rect width="492" height="68" rx="14" fill="rgba(79, 140, 255, 0.08)" stroke="rgba(79, 140, 255, 0.35)" stroke-width="1.5"/>
        <g transform="translate(20, 34)">
          <circle cx="0" cy="0" r="18" fill="url(#blue-grad)"/>
          <text x="0" y="5" fill="#F8FAFC" font-size="14" font-weight="900" text-anchor="middle">S+</text>
        </g>
        <text x="54" y="28" fill="#F8FAFC" font-size="15" font-weight="800">GLOBAL ARCHITECT RANK: S+ TIER</text>
        <text x="54" y="46" fill="#4F8CFF" font-size="12" font-weight="600">Top 1% Engineering Consistency &amp; System Quality</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: LANGUAGE DISTRIBUTION & ACCURACY RINGS -->
  <g transform="translate(620, 110)">
    <rect width="540" height="370" rx="20" fill="url(#card-glass)" stroke="url(#card-border)" stroke-width="1.5"/>
    <rect x="1" y="1" width="538" height="368" rx="19" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- Panel Title -->
    <text x="24" y="34" fill="#F8FAFC" font-size="18" font-weight="800">Language Ecosystem &amp; Code Volume</text>
    <text x="24" y="52" fill="#94A3B8" font-size="11" font-weight="600">AUTOMATED CODEBASE ANALYSIS</text>
    <line x1="24" y1="66" x2="516" y2="66" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Left: Circular Ring Chart -->
    <g transform="translate(100, 195)">
      <!-- Track Ring -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14"/>
      <!-- Animated Ring -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="url(#blue-grad)" stroke-width="14" stroke-linecap="round" class="ring-circle" transform="rotate(-90)"/>
      
      <!-- Inner Ring Label -->
      <text x="0" y="-4" fill="#F8FAFC" font-size="22" font-weight="900" text-anchor="middle" class="mono">65%</text>
      <text x="0" y="14" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle">PYTHON</text>
    </g>

    <!-- Right: Language Progress Bars -->
    <g transform="translate(210, 95)" font-size="12" font-weight="700">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#F8FAFC">Python</text>
        <text x="280" y="14" fill="#4F8CFF" text-anchor="end" class="mono">65%</text>
        <rect x="0" y="22" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
        <rect x="0" y="22" height="8" rx="4" fill="url(#blue-grad)" class="bar-python"/>
      </g>

      <!-- C++ -->
      <g transform="translate(0, 48)">
        <text x="0" y="14" fill="#F8FAFC">C++</text>
        <text x="280" y="14" fill="#7C5CFF" text-anchor="end" class="mono">20%</text>
        <rect x="0" y="22" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
        <rect x="0" y="22" height="8" rx="4" fill="url(#purple-grad)" class="bar-cpp"/>
      </g>

      <!-- SQL -->
      <g transform="translate(0, 96)">
        <text x="0" y="14" fill="#F8FAFC">SQL &amp; Data</text>
        <text x="280" y="14" fill="#B28DFF" text-anchor="end" class="mono">10%</text>
        <rect x="0" y="22" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
        <rect x="0" y="22" height="8" rx="4" fill="url(#accent-grad)" class="bar-sql"/>
      </g>

      <!-- JavaScript -->
      <g transform="translate(0, 144)">
        <text x="0" y="14" fill="#F8FAFC">JavaScript / HTML</text>
        <text x="280" y="14" fill="#94A3B8" text-anchor="end" class="mono">5%</text>
        <rect x="0" y="22" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
        <rect x="0" y="22" height="8" rx="4" fill="#94A3B8" class="bar-js"/>
      </g>
    </g>

    <!-- Bottom Stat Pill -->
    <g transform="translate(24, 290)">
      <rect width="492" height="52" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="20" cy="26" r="4" fill="#27C93F"/>
      <text x="34" y="21" fill="#F8FAFC" font-size="12" font-weight="700">99.4% Automated Build Verification Pass Rate</text>
      <text x="34" y="38" fill="#94A3B8" font-size="11" font-weight="500">Continuous Integration &amp; MLOps Evaluation Pipelines</text>
    </g>
  </g>
</svg>