<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E" />
      <stop offset="100%" stop-color="#0A1224" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#B28DFF" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=Fira+Code:wght@400;500;700&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace; }

      @keyframes ringPulse {
        0% { stroke-dashoffset: 280; }
        100% { stroke-dashoffset: 40; }
      }

      @keyframes barSlide {
        0% { width: 0; }
        100% { width: var(--target-width); }
      }

      .animated-ring {
        stroke-dasharray: 280;
        animation: ringPulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      .pulse-dot {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="480" rx="30" fill="url(#bgGradient)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text y="0" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="600" letter-spacing="3">AI RESEARCH TELEMETRY</text>
    <text y="30" class="font-sans" fill="#F8FAFC" font-size="24" font-weight="800" letter-spacing="1">GITHUB PERFORMANCE &amp; METRICS</text>
  </g>

  <!-- LEFT PANEL: STAT CARDS GRID -->
  <g transform="translate(60, 110)">
    <!-- Metric Card 1: Repositories -->
    <g transform="translate(0, 0)">
      <rect width="240" height="150" rx="16" fill="rgba(10, 18, 36, 0.65)" stroke="url(#cardBorder)" stroke-width="1.5" />
      <circle cx="36" cy="36" r="16" fill="rgba(79, 140, 255, 0.12)" />
      <!-- Repo Icon -->
      <path d="M 30,36 L 42,36 M 36,30 L 36,42" stroke="#4F8CFF" stroke-width="2" stroke-linecap="round" />
      <text x="36" y="88" class="font-sans" fill="#F8FAFC" font-size="34" font-weight="800">50+</text>
      <text x="36" y="114" class="font-mono" fill="#94A3B8" font-size="12" font-weight="500">REPOSITORIES</text>
    </g>

    <!-- Metric Card 2: Commits -->
    <g transform="translate(260, 0)">
      <rect width="240" height="150" rx="16" fill="rgba(10, 18, 36, 0.65)" stroke="url(#cardBorder)" stroke-width="1.5" />
      <circle cx="36" cy="36" r="16" fill="rgba(124, 92, 255, 0.12)" />
      <!-- Commit Icon -->
      <circle cx="36" cy="36" r="6" stroke="#7C5CFF" stroke-width="2" fill="none" />
      <line x1="24" y1="36" x2="30" y2="36" stroke="#7C5CFF" stroke-width="2" />
      <line x1="42" y1="36" x2="48" y2="36" stroke="#7C5CFF" stroke-width="2" />
      <text x="36" y="88" class="font-sans" fill="#F8FAFC" font-size="34" font-weight="800">1,250+</text>
      <text x="36" y="114" class="font-mono" fill="#94A3B8" font-size="12" font-weight="500">TOTAL COMMITS</text>
    </g>

    <!-- Metric Card 3: Stars -->
    <g transform="translate(0, 170)">
      <rect width="240" height="150" rx="16" fill="rgba(10, 18, 36, 0.65)" stroke="url(#cardBorder)" stroke-width="1.5" />
      <circle cx="36" cy="36" r="16" fill="rgba(178, 141, 255, 0.12)" />
      <!-- Star Icon -->
      <polygon points="36,26 39,32 46,33 41,38 42,45 36,41 30,45 31,38 26,33 33,32" fill="#B28DFF" />
      <text x="36" y="88" class="font-sans" fill="#F8FAFC" font-size="34" font-weight="800">120+</text>
      <text x="36" y="114" class="font-mono" fill="#94A3B8" font-size="12" font-weight="500">STARS EARNED</text>
    </g>

    <!-- Metric Card 4: Global Rank -->
    <g transform="translate(260, 170)">
      <rect width="240" height="150" rx="16" fill="rgba(10, 18, 36, 0.65)" stroke="url(#cardBorder)" stroke-width="1.5" />
      <circle cx="36" cy="36" r="16" fill="rgba(39, 201, 63, 0.12)" />
      <text x="36" y="41" text-anchor="middle" class="font-mono" fill="#27C93F" font-size="14" font-weight="700">A+</text>
      <text x="36" y="88" class="font-sans" fill="url(#primaryGrad)" font-size="34" font-weight="900" filter="url(#softGlow)">S-TIER</text>
      <text x="36" y="88" class="font-sans" fill="url(#primaryGrad)" font-size="34" font-weight="900">S-TIER</text>
      <text x="36" y="114" class="font-mono" fill="#94A3B8" font-size="12" font-weight="500">ENGINEERING RANK</text>
    </g>
  </g>

  <!-- RIGHT PANEL: CIRCULAR SCORE & LANGUAGE RATIOS -->
  <g transform="translate(600, 110)">
    <!-- Right Container Card -->
    <rect width="540" height="320" rx="20" fill="rgba(10, 18, 36, 0.65)" stroke="url(#cardBorder)" stroke-width="1.5" />

    <!-- Circular Progress Gauge -->
    <g transform="translate(130, 160)">
      <!-- Background Circle -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="12" />
      <!-- Animated Score Arc -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" class="animated-ring" transform="rotate(-90)" />
      <text x="0" y="8" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="32" font-weight="900">98.4%</text>
      <text x="0" y="28" text-anchor="middle" class="font-mono" fill="#94A3B8" font-size="10">AI COMMIT SCORE</text>
    </g>

    <!-- Language Distribution Bars -->
    <g transform="translate(260, 45)" class="font-sans">
      <text x="0" y="0" class="font-mono" fill="#4F8CFF" font-size="11" font-weight="600" letter-spacing="2">TOP LANGUAGES</text>

      <!-- Python (70%) -->
      <g transform="translate(0, 25)">
        <text x="0" y="0" fill="#F8FAFC" font-size="13" font-weight="600">Python</text>
        <text x="240" y="0" text-anchor="end" class="font-mono" fill="#4F8CFF" font-size="12">70%</text>
        <rect x="0" y="8" width="240" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
        <rect x="0" y="8" width="168" height="8" rx="4" fill="#4F8CFF" />
      </g>

      <!-- C++ (15%) -->
      <g transform="translate(0, 75)">
        <text x="0" y="0" fill="#F8FAFC" font-size="13" font-weight="600">C++</text>
        <text x="240" y="0" text-anchor="end" class="font-mono" fill="#7C5CFF" font-size="12">15%</text>
        <rect x="0" y="8" width="240" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
        <rect x="0" y="8" width="36" height="8" rx="4" fill="#7C5CFF" />
      </g>

      <!-- SQL / TS (15%) -->
      <g transform="translate(0, 125)">
        <text x="0" y="0" fill="#F8FAFC" font-size="13" font-weight="600">SQL &amp; TS</text>
        <text x="240" y="0" text-anchor="end" class="font-mono" fill="#B28DFF" font-size="12">15%</text>
        <rect x="0" y="8" width="240" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
        <rect x="0" y="8" width="36" height="8" rx="4" fill="#B28DFF" />
      </g>

      <!-- Live Telemetry Status -->
      <g transform="translate(0, 195)">
        <rect x="0" y="0" width="240" height="32" rx="8" fill="rgba(39, 201, 63, 0.08)" stroke="rgba(39, 201, 63, 0.2)" />
        <circle cx="16" cy="16" r="4" fill="#27C93F" class="pulse-dot" />
        <text x="28" y="20" class="font-mono" fill="#CBD5E1" font-size="11">SYSTEM TELEMETRY: ACTIVE</text>
      </g>
    </g>
  </g>
</svg>
