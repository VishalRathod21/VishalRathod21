<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'Fira Code', monospace; }

      @keyframes ringSpin {
        0% { stroke-dashoffset: 440; }
        100% { stroke-dashoffset: 80; }
      }
      @keyframes barFill1 { 0% { width: 0; } 100% { width: 330px; } }
      @keyframes barFill2 { 0% { width: 0; } 100% { width: 110px; } }
      @keyframes barFill3 { 0% { width: 0; } 100% { width: 90px; } }
      @keyframes barFill4 { 0% { width: 0; } 100% { width: 60px; } }

      .ring {
        stroke-dasharray: 440;
        stroke-dashoffset: 80;
        animation: ringSpin 3s ease-out forwards;
      }
      .b1 { animation: barFill1 2s ease-out forwards; }
      .b2 { animation: barFill2 2s ease-out 0.3s forwards; }
      .b3 { animation: barFill3 2s ease-out 0.6s forwards; }
      .b4 { animation: barFill4 2s ease-out 0.9s forwards; }
    </style>

    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E"/>
      <stop offset="50%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0.4)"/>
      <stop offset="50%" stop-color="rgba(124, 92, 255, 0.2)"/>
      <stop offset="100%" stop-color="rgba(178, 141, 255, 0.4)"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#B28DFF"/>
    </linearGradient>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1400" height="480" rx="30" fill="url(#statsBg)"/>

  <!-- Top Title -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#4F8CFF" font-size="12" font-weight="700" class="mono" letter-spacing="2">DEVELOPER TELEMETRY &amp; METRICS</text>
    <text x="0" y="28" fill="#F8FAFC" font-size="24" font-weight="800">GITHUB RESEARCH &amp; COMMIT MATRIX</text>
  </g>

  <!-- CARD 1: OVERALL RANK & METRICS -->
  <g transform="translate(60, 110)">
    <rect width="410" height="320" rx="22" fill="rgba(10, 18, 36, 0.65)" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Circular Progress Ring (Rank S) -->
    <g transform="translate(100, 100)">
      <!-- Background Circle -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="10"/>
      <!-- Animated Progress Circle -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" class="ring" transform="rotate(-90)" filter="url(#glowFilter)"/>
      <text x="0" y="10" fill="#F8FAFC" font-size="38" font-weight="800" text-anchor="middle" class="mono">S+</text>
      <text x="0" y="28" fill="#94A3B8" font-size="10" text-anchor="middle" class="mono">RANK</text>
    </g>

    <!-- Metrics List -->
    <g transform="translate(200, 45)">
      <g transform="translate(0, 0)">
        <text x="0" y="16" fill="#94A3B8" font-size="11" class="mono">TOTAL COMMITS</text>
        <text x="0" y="38" fill="#F8FAFC" font-size="20" font-weight="700">1,480+</text>
      </g>
      <g transform="translate(0, 55)">
        <text x="0" y="16" fill="#94A3B8" font-size="11" class="mono">REPOSITORIES</text>
        <text x="0" y="38" fill="#4F8CFF" font-size="20" font-weight="700">32+</text>
      </g>
      <g transform="translate(0, 110)">
        <text x="0" y="16" fill="#94A3B8" font-size="11" class="mono">STARS EARNED</text>
        <text x="0" y="38" fill="#7C5CFF" font-size="20" font-weight="700">240+</text>
      </g>
      <g transform="translate(0, 165)">
        <text x="0" y="16" fill="#94A3B8" font-size="11" class="mono">CONTRIBUTIONS</text>
        <text x="0" y="38" fill="#B28DFF" font-size="20" font-weight="700">99.4%</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(25, 255)">
      <rect width="360" height="40" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
      <circle cx="20" cy="20" r="4" fill="#27C93F"/>
      <text x="32" y="24" fill="#27C93F" font-size="12" font-weight="600" class="mono">TOP 1% AI ENGINEERING CONTRIBUTOR</text>
    </g>
  </g>

  <!-- CARD 2: LANGUAGE DISTRIBUTION -->
  <g transform="translate(495, 110)">
    <rect width="410" height="320" rx="22" fill="rgba(10, 18, 36, 0.65)" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <text x="30" y="40" fill="#F8FAFC" font-size="16" font-weight="700">MOST USED LANGUAGES</text>
    <text x="30" y="58" fill="#94A3B8" font-size="11" class="mono">CODEBASE SHARE DISTRIBUTION</text>

    <!-- Language Bars -->
    <g transform="translate(30, 90)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#F8FAFC" font-size="13" font-weight="600">Python</text>
        <text x="350" y="14" fill="#4F8CFF" font-size="12" font-weight="700" text-anchor="end" class="mono">65%</text>
        <rect y="22" width="350" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="227" height="8" rx="4" fill="#4F8CFF" filter="url(#glowFilter)"/>
      </g>

      <!-- C++ -->
      <g transform="translate(0, 52)">
        <text x="0" y="14" fill="#F8FAFC" font-size="13" font-weight="600">C++</text>
        <text x="350" y="14" fill="#7C5CFF" font-size="12" font-weight="700" text-anchor="end" class="mono">15%</text>
        <rect y="22" width="350" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="52" height="8" rx="4" fill="#7C5CFF"/>
      </g>

      <!-- TypeScript / JS -->
      <g transform="translate(0, 104)">
        <text x="0" y="14" fill="#F8FAFC" font-size="13" font-weight="600">TypeScript / JavaScript</text>
        <text x="350" y="14" fill="#B28DFF" font-size="12" font-weight="700" text-anchor="end" class="mono">12%</text>
        <rect y="22" width="350" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="42" height="8" rx="4" fill="#B28DFF"/>
      </g>

      <!-- SQL & Shell -->
      <g transform="translate(0, 156)">
        <text x="0" y="14" fill="#F8FAFC" font-size="13" font-weight="600">SQL &amp; Shell Scripting</text>
        <text x="350" y="14" fill="#27C93F" font-size="12" font-weight="700" text-anchor="end" class="mono">8%</text>
        <rect y="22" width="350" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="28" height="8" rx="4" fill="#27C93F"/>
      </g>
    </g>

    <!-- Bottom Stack Bar -->
    <g transform="translate(30, 275)">
      <rect width="350" height="12" rx="6" fill="rgba(255, 255, 255, 0.08)"/>
      <rect x="0" width="227" height="12" rx="6" fill="#4F8CFF"/>
      <rect x="228" width="52" height="12" fill="#7C5CFF"/>
      <rect x="281" width="42" height="12" fill="#B28DFF"/>
      <rect x="324" width="26" height="12" rx="6" fill="#27C93F"/>
    </g>
  </g>

  <!-- CARD 3: ENGINEERING EFFICIENCY & PERFORMANCE -->
  <g transform="translate(930, 110)">
    <rect width="410" height="320" rx="22" fill="rgba(10, 18, 36, 0.65)" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <text x="30" y="40" fill="#F8FAFC" font-size="16" font-weight="700">CODE &amp; SYSTEM AUDIT</text>
    <text x="30" y="58" fill="#94A3B8" font-size="11" class="mono">PRODUCTION AUDIT SCORE</text>

    <g transform="translate(30, 85)">
      <rect width="350" height="60" rx="14" fill="rgba(79, 140, 255, 0.08)" stroke="rgba(79, 140, 255, 0.2)"/>
      <text x="20" y="26" fill="#94A3B8" font-size="11" class="mono">CODE QUALITY INDEX</text>
      <text x="20" y="48" fill="#4F8CFF" font-size="18" font-weight="700">A+ EXCELLENCE</text>
      <text x="320" y="38" fill="#27C93F" font-size="22" font-weight="800" text-anchor="end" class="mono">100%</text>

      <rect y="75" width="350" height="60" rx="14" fill="rgba(124, 92, 255, 0.08)" stroke="rgba(124, 92, 255, 0.2)"/>
      <text x="20" y="101" fill="#94A3B8" font-size="11" class="mono">MODEL DEPLOYMENT SUCCESS</text>
      <text x="20" y="123" fill="#7C5CFF" font-size="18" font-weight="700">99.8% RELIABILITY</text>
      <text x="320" y="113" fill="#7C5CFF" font-size="22" font-weight="800" text-anchor="end" class="mono">99.8%</text>

      <rect y="150" width="350" height="60" rx="14" fill="rgba(178, 141, 255, 0.08)" stroke="rgba(178, 141, 255, 0.2)"/>
      <text x="20" y="176" fill="#94A3B8" font-size="11" class="mono">AGENT LATENCY OPTIMIZATION</text>
      <text x="20" y="198" fill="#B28DFF" font-size="18" font-weight="700">&lt; 15ms INFERENCE</text>
      <text x="320" y="188" fill="#B28DFF" font-size="22" font-weight="800" text-anchor="end" class="mono">⚡ FAST</text>
    </g>
  </g>
</svg>
