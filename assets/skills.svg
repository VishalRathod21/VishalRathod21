<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E" />
      <stop offset="100%" stop-color="#0A1224" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>

    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#B28DFF" />
    </linearGradient>

    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B28DFF" />
      <stop offset="100%" stop-color="#4F8CFF" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace; }

      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      .card-1 { animation: floatCard1 6s ease-in-out indefinite; }
      .card-2 { animation: floatCard2 7s ease-in-out indefinite; }
      .card-3 { animation: floatCard3 5.5s ease-in-out indefinite; }

      .badge-bg {
        fill: rgba(255, 255, 255, 0.05);
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
        transition: all 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="30" fill="url(#bgGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Section Title Header -->
  <g transform="translate(60, 50)">
    <text y="0" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="600" letter-spacing="3">CAPABILITIES &amp; ARCHITECTURE</text>
    <text y="32" class="font-sans" fill="#F8FAFC" font-size="26" font-weight="800" letter-spacing="1">AI STACK &amp; TECHNICAL ECOSYSTEM</text>
  </g>

  <!-- CATEGORY 1: LANGUAGES -->
  <g transform="translate(60, 110)" class="card-1">
    <rect width="340" height="340" rx="20" fill="rgba(10, 18, 36, 0.7)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <rect width="340" height="4" rx="2" fill="url(#accent1)" />

    <!-- Card Header -->
    <g transform="translate(24, 35)">
      <circle cx="14" cy="14" r="14" fill="rgba(79, 140, 255, 0.15)" />
      <path d="M 9,14 L 14,9 L 19,14 M 14,19 L 14,9" stroke="#4F8CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="38" y="19" class="font-sans" fill="#F8FAFC" font-size="18" font-weight="700">Languages</text>
      <text x="38" y="36" class="font-mono" fill="#94A3B8" font-size="11">CORE COMPUTATION</text>
    </g>

    <!-- Skill Items -->
    <g transform="translate(24, 105)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="292" height="42" rx="10" class="badge-bg" />
        <text x="16" y="26" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="600">Python</text>
        <text x="276" y="26" text-anchor="end" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="600">98%</text>
        <rect x="16" y="34" width="260" height="3" rx="1.5" fill="rgba(255,255,255,0.08)" />
        <rect x="16" y="34" width="254" height="3" rx="1.5" fill="url(#accent1)" />
      </g>

      <!-- C++ -->
      <g transform="translate(0, 54)">
        <rect width="292" height="42" rx="10" class="badge-bg" />
        <text x="16" y="26" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="600">C++</text>
        <text x="276" y="26" text-anchor="end" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="600">88%</text>
        <rect x="16" y="34" width="260" height="3" rx="1.5" fill="rgba(255,255,255,0.08)" />
        <rect x="16" y="34" width="228" height="3" rx="1.5" fill="url(#accent1)" />
      </g>

      <!-- SQL -->
      <g transform="translate(0, 108)">
        <rect width="292" height="42" rx="10" class="badge-bg" />
        <text x="16" y="26" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="600">SQL</text>
        <text x="276" y="26" text-anchor="end" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="600">92%</text>
        <rect x="16" y="34" width="260" height="3" rx="1.5" fill="rgba(255,255,255,0.08)" />
        <rect x="16" y="34" width="239" height="3" rx="1.5" fill="url(#accent1)" />
      </g>

      <!-- JavaScript -->
      <g transform="translate(0, 162)">
        <rect width="292" height="42" rx="10" class="badge-bg" />
        <text x="16" y="26" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="600">JavaScript / TS</text>
        <text x="276" y="26" text-anchor="end" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="600">90%</text>
        <rect x="16" y="34" width="260" height="3" rx="1.5" fill="rgba(255,255,255,0.08)" />
        <rect x="16" y="34" width="234" height="3" rx="1.5" fill="url(#accent1)" />
      </g>
    </g>
  </g>

  <!-- CATEGORY 2: AI & FRAMEWORKS -->
  <g transform="translate(430, 110)" class="card-2">
    <rect width="340" height="340" rx="20" fill="rgba(10, 18, 36, 0.7)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <rect width="340" height="4" rx="2" fill="url(#accent2)" />

    <!-- Card Header -->
    <g transform="translate(24, 35)">
      <circle cx="14" cy="14" r="14" fill="rgba(124, 92, 255, 0.15)" />
      <circle cx="14" cy="14" r="5" fill="#7C5CFF" />
      <text x="38" y="19" class="font-sans" fill="#F8FAFC" font-size="18" font-weight="700">AI &amp; Frameworks</text>
      <text x="38" y="36" class="font-mono" fill="#94A3B8" font-size="11">NEURAL &amp; AGENTIC</text>
    </g>

    <!-- Skill Pills Grid -->
    <g transform="translate(24, 95)">
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">PyTorch</text>
      </g>
      <g transform="translate(150, 0)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">TensorFlow</text>
      </g>

      <g transform="translate(0, 44)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">LangChain</text>
      </g>
      <g transform="translate(150, 44)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">LangGraph</text>
      </g>

      <g transform="translate(0, 88)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">CrewAI</text>
      </g>
      <g transform="translate(150, 88)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">AutoGen</text>
      </g>

      <g transform="translate(0, 132)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">OpenAI API</text>
      </g>
      <g transform="translate(150, 132)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">Gemini Pro</text>
      </g>

      <g transform="translate(0, 176)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">Groq LPU</text>
      </g>
      <g transform="translate(150, 176)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">Scikit-Learn</text>
      </g>
    </g>
  </g>

  <!-- CATEGORY 3: MLOPS & BACKEND -->
  <g transform="translate(800, 110)" class="card-3">
    <rect width="340" height="340" rx="20" fill="rgba(10, 18, 36, 0.7)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <rect width="340" height="4" rx="2" fill="url(#accent3)" />

    <!-- Card Header -->
    <g transform="translate(24, 35)">
      <circle cx="14" cy="14" r="14" fill="rgba(178, 141, 255, 0.15)" />
      <rect x="9" y="9" width="10" height="10" rx="2" stroke="#B28DFF" stroke-width="2" fill="none" />
      <text x="38" y="19" class="font-sans" fill="#F8FAFC" font-size="18" font-weight="700">Backend &amp; MLOps</text>
      <text x="38" y="36" class="font-mono" fill="#94A3B8" font-size="11">DEPLOYMENT &amp; INFRA</text>
    </g>

    <!-- Skill Pills Grid -->
    <g transform="translate(24, 95)">
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">FastAPI</text>
      </g>
      <g transform="translate(150, 0)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">Flask</text>
      </g>

      <g transform="translate(0, 44)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">Docker</text>
      </g>
      <g transform="translate(150, 44)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">Linux / Bash</text>
      </g>

      <g transform="translate(0, 88)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">Redis</text>
      </g>
      <g transform="translate(150, 88)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">PostgreSQL</text>
      </g>

      <g transform="translate(0, 132)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">MongoDB</text>
      </g>
      <g transform="translate(150, 132)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">AWS Cloud</text>
      </g>

      <g transform="translate(0, 176)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">Git / GitHub</text>
      </g>
      <g transform="translate(150, 176)">
        <rect width="140" height="34" rx="8" class="badge-bg" />
        <text x="70" y="21" text-anchor="middle" class="font-sans" fill="#F8FAFC" font-size="12" font-weight="600">ChromaDB / Vector</text>
      </g>
    </g>
  </g>
</svg>
