<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" width="1400" height="580">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'Fira Code', monospace; }

      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }

      .card1 { animation: floatCard1 6s ease-in-out infinite; }
      .card2 { animation: floatCard2 7s ease-in-out infinite 1s; }
      .card3 { animation: floatCard3 5s ease-in-out infinite 0.5s; }
      .glowPulse { animation: pulseGlow 4s ease-in-out infinite; }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E" />
      <stop offset="50%" stop-color="#060C1A" />
      <stop offset="100%" stop-color="#0A1224" />
    </linearGradient>

    <!-- Glass Borders -->
    <linearGradient id="cardBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="cardBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(124, 92, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <linearGradient id="cardBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(178, 141, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="badgeGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1400" height="580" rx="30" fill="url(#skillsBg)"/>

  <!-- Header Banner -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#4F8CFF" font-size="12" font-weight="700" class="mono" letter-spacing="2">TECHNICAL MATRIX &amp; CORE CAPABILITIES</text>
    <text x="0" y="28" fill="#F8FAFC" font-size="24" font-weight="800">ENGINEERING ARCHITECTURE &amp; STACK</text>
  </g>

  <!-- CARD 1: PROGRAMMING LANGUAGES -->
  <g transform="translate(60, 110)" class="card1">
    <rect width="400" height="420" rx="24" fill="rgba(10, 18, 36, 0.65)" stroke="url(#cardBorder1)" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- Category Header -->
    <g transform="translate(30, 35)">
      <rect width="42" height="42" rx="12" fill="rgba(79, 140, 255, 0.15)" stroke="rgba(79, 140, 255, 0.4)"/>
      <text x="21" y="26" fill="#4F8CFF" font-size="18" text-anchor="middle">💻</text>
      <text x="56" y="20" fill="#F8FAFC" font-size="18" font-weight="700">LANGUAGES</text>
      <text x="56" y="36" fill="#94A3B8" font-size="11" class="mono">CORE COMPUTATION</text>
    </g>

    <!-- Skill Items -->
    <g transform="translate(30, 105)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <text x="0" y="15" fill="#F8FAFC" font-size="14" font-weight="600">Python</text>
        <text x="340" y="15" fill="#4F8CFF" font-size="12" font-weight="700" class="mono">98%</text>
        <rect y="24" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="24" width="333" height="6" rx="3" fill="#4F8CFF" filter="url(#badgeGlow)"/>
      </g>

      <!-- C++ -->
      <g transform="translate(0, 60)">
        <text x="0" y="15" fill="#F8FAFC" font-size="14" font-weight="600">C++</text>
        <text x="340" y="15" fill="#4F8CFF" font-size="12" font-weight="700" class="mono">88%</text>
        <rect y="24" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="24" width="300" height="6" rx="3" fill="#4F8CFF"/>
      </g>

      <!-- SQL -->
      <g transform="translate(0, 120)">
        <text x="0" y="15" fill="#F8FAFC" font-size="14" font-weight="600">SQL</text>
        <text x="340" y="15" fill="#4F8CFF" font-size="12" font-weight="700" class="mono">92%</text>
        <rect y="24" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="24" width="313" height="6" rx="3" fill="#4F8CFF"/>
      </g>

      <!-- JavaScript -->
      <g transform="translate(0, 180)">
        <text x="0" y="15" fill="#F8FAFC" font-size="14" font-weight="600">JavaScript / TypeScript</text>
        <text x="340" y="15" fill="#4F8CFF" font-size="12" font-weight="700" class="mono">90%</text>
        <rect y="24" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="24" width="306" height="6" rx="3" fill="#4F8CFF"/>
      </g>
    </g>

    <!-- Bottom Badge Bar -->
    <g transform="translate(30, 360)">
      <rect width="340" height="36" rx="10" fill="rgba(79, 140, 255, 0.08)" stroke="rgba(79, 140, 255, 0.2)"/>
      <text x="170" y="22" fill="#4F8CFF" font-size="11" font-weight="600" text-anchor="middle" class="mono">HIGH PERFORMANCE COMPUTING &amp; ALGORITHMS</text>
    </g>
  </g>

  <!-- CARD 2: ARTIFICIAL INTELLIGENCE & LLMS -->
  <g transform="translate(500, 110)" class="card2">
    <rect width="400" height="420" rx="24" fill="rgba(10, 18, 36, 0.65)" stroke="url(#cardBorder2)" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- Category Header -->
    <g transform="translate(30, 35)">
      <rect width="42" height="42" rx="12" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.4)"/>
      <text x="21" y="26" fill="#7C5CFF" font-size="18" text-anchor="middle">🤖</text>
      <text x="56" y="20" fill="#F8FAFC" font-size="18" font-weight="700">ARTIFICIAL INTELLIGENCE</text>
      <text x="56" y="36" fill="#94A3B8" font-size="11" class="mono">DEEP LEARNING &amp; LLM MATRIX</text>
    </g>

    <!-- Skill Pills Cloud -->
    <g transform="translate(30, 95)">
      <!-- Row 1 -->
      <rect width="100" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="50" y="20" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">PyTorch</text>

      <rect x="110" width="115" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="167" y="20" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">TensorFlow</text>

      <rect x="235" width="105" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="287" y="20" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Scikit-Learn</text>

      <!-- Row 2 -->
      <rect y="42" width="105" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="52" y="62" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">LangChain</text>

      <rect x="115" y="42" width="105" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="167" y="62" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">LangGraph</text>

      <rect x="230" y="42" width="110" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="285" y="62" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">CrewAI</text>

      <!-- Row 3 -->
      <rect y="84" width="95" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="47" y="104" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">AutoGen</text>

      <rect x="105" y="84" width="100" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="155" y="104" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">OpenAI API</text>

      <rect x="215" y="84" width="125" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="277" y="104" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Gemini Pro</text>

      <!-- Row 4 -->
      <rect y="126" width="85" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="42" y="146" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Groq LPU</text>

      <rect x="95" y="126" width="115" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="152" y="146" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">vLLM Inference</text>

      <rect x="220" y="126" width="120" height="32" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.3)"/>
      <text x="280" y="146" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Chroma / FAISS</text>

      <!-- Sub-label Box -->
      <rect y="175" width="340" height="70" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="15" y="200" fill="#7C5CFF" font-size="11" font-weight="700" class="mono">SPECIALIZATIONS:</text>
      <text x="15" y="222" fill="#94A3B8" font-size="12">Autonomous Agents • RAG Systems • Fine-Tuning</text>
    </g>

    <!-- Bottom Badge Bar -->
    <g transform="translate(30, 360)">
      <rect width="340" height="36" rx="10" fill="rgba(124, 92, 255, 0.08)" stroke="rgba(124, 92, 255, 0.2)"/>
      <text x="170" y="22" fill="#7C5CFF" font-size="11" font-weight="600" text-anchor="middle" class="mono">AGENTIC &amp; GENERATIVE AI SYSTEMS</text>
    </g>
  </g>

  <!-- CARD 3: BACKEND & CLOUD INFRASTRUCTURE -->
  <g transform="translate(940, 110)" class="card3">
    <rect width="400" height="420" rx="24" fill="rgba(10, 18, 36, 0.65)" stroke="url(#cardBorder3)" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- Category Header -->
    <g transform="translate(30, 35)">
      <rect width="42" height="42" rx="12" fill="rgba(178, 141, 255, 0.15)" stroke="rgba(178, 141, 255, 0.4)"/>
      <text x="21" y="26" fill="#B28DFF" font-size="18" text-anchor="middle">⚡</text>
      <text x="56" y="20" fill="#F8FAFC" font-size="18" font-weight="700">BACKEND &amp; INFRA</text>
      <text x="56" y="36" fill="#94A3B8" font-size="11" class="mono">DISTRIBUTED SYSTEMS</text>
    </g>

    <!-- Skill Items -->
    <g transform="translate(30, 95)">
      <!-- FastAPI & Flask -->
      <g transform="translate(0, 0)">
        <text x="0" y="15" fill="#F8FAFC" font-size="13" font-weight="600">FastAPI / Flask</text>
        <text x="340" y="15" fill="#B28DFF" font-size="12" font-weight="700" class="mono">95%</text>
        <rect y="22" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="323" height="6" rx="3" fill="#B28DFF"/>
      </g>

      <!-- Docker & Linux -->
      <g transform="translate(0, 52)">
        <text x="0" y="15" fill="#F8FAFC" font-size="13" font-weight="600">Docker &amp; Linux Containerization</text>
        <text x="340" y="15" fill="#B28DFF" font-size="12" font-weight="700" class="mono">90%</text>
        <rect y="22" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="306" height="6" rx="3" fill="#B28DFF"/>
      </g>

      <!-- Redis & Async Caching -->
      <g transform="translate(0, 104)">
        <text x="0" y="15" fill="#F8FAFC" font-size="13" font-weight="600">Redis &amp; Message Queues</text>
        <text x="340" y="15" fill="#B28DFF" font-size="12" font-weight="700" class="mono">88%</text>
        <rect y="22" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="299" height="6" rx="3" fill="#B28DFF"/>
      </g>

      <!-- PostgreSQL & MongoDB -->
      <g transform="translate(0, 156)">
        <text x="0" y="15" fill="#F8FAFC" font-size="13" font-weight="600">PostgreSQL / MongoDB</text>
        <text x="340" y="15" fill="#B28DFF" font-size="12" font-weight="700" class="mono">92%</text>
        <rect y="22" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="312" height="6" rx="3" fill="#B28DFF"/>
      </g>

      <!-- AWS Cloud -->
      <g transform="translate(0, 208)">
        <text x="0" y="15" fill="#F8FAFC" font-size="13" font-weight="600">AWS Cloud Services (EC2, S3)</text>
        <text x="340" y="15" fill="#B28DFF" font-size="12" font-weight="700" class="mono">85%</text>
        <rect y="22" width="340" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
        <rect y="22" width="289" height="6" rx="3" fill="#B28DFF"/>
      </g>
    </g>

    <!-- Bottom Badge Bar -->
    <g transform="translate(30, 360)">
      <rect width="340" height="36" rx="10" fill="rgba(178, 141, 255, 0.08)" stroke="rgba(178, 141, 255, 0.2)"/>
      <text x="170" y="22" fill="#B28DFF" font-size="11" font-weight="600" text-anchor="middle" class="mono">PRODUCTION-GRADE MLOPS INFRASTRUCTURE</text>
    </g>
  </g>
</svg>
