<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="skillsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Pill Glow -->
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .cat-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #00E5FF;
      letter-spacing: 1.5px;
    }
    .pill-bg {
      fill: #1E293B;
      stroke: #334155;
      stroke-width: 1px;
      transition: all 0.3s ease;
    }
    .pill-bg:hover {
      fill: #0F172A;
      stroke: #00E5FF;
      filter: url(#pillGlow);
    }
    .pill-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #F8FAFC;
    }
    .accent-icon {
      fill: #8B5CF6;
    }
    .accent-ai {
      fill: #FF3CAC;
    }
    .pulse-pill {
      animation: pillPulse 4s ease-in-out infinite alternate;
    }
    @keyframes pillPulse {
      0% { stroke: #334155; }
      50% { stroke: #8B5CF6; }
      100% { stroke: #00E5FF; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="356" rx="16" fill="url(#skillsBg)" stroke="url(#skillsBorder)" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(30, 36)">
    <circle cx="0" cy="0" r="4" fill="#FF3CAC"/>
    <circle cx="12" cy="0" r="4" fill="#8B5CF6"/>
    <circle cx="24" cy="0" r="4" fill="#00E5FF"/>
    <text x="40" y="4" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" letter-spacing="1">TECTONIC MATRIX // SKILLS &amp; CAPABILITIES</text>
  </g>

  <!-- Section 1: AI & AGENTIC SYSTEMS -->
  <g transform="translate(30, 75)">
    <text x="0" y="0" class="cat-title">⚡ AI, ML &amp; AGENTIC FRAMEWORKS</text>

    <!-- Pills Grid -->
    <g transform="translate(0, 15)">
      <!-- PyTorch -->
      <g transform="translate(0, 0)"><rect class="pill-bg pulse-pill" width="88" height="28" rx="14"/><text x="44" y="18" class="pill-text" text-anchor="middle">PyTorch</text></g>
      <!-- TensorFlow -->
      <g transform="translate(96, 0)"><rect class="pill-bg pulse-pill" width="102" height="28" rx="14"/><text x="51" y="18" class="pill-text" text-anchor="middle">TensorFlow</text></g>
      <!-- Scikit-Learn -->
      <g transform="translate(206, 0)"><rect class="pill-bg" width="112" height="28" rx="14"/><text x="56" y="18" class="pill-text" text-anchor="middle">Scikit-Learn</text></g>
      <!-- XGBoost -->
      <g transform="translate(326, 0)"><rect class="pill-bg" width="84" height="28" rx="14"/><text x="42" y="18" class="pill-text" text-anchor="middle">XGBoost</text></g>
      <!-- OpenCV -->
      <g transform="translate(418, 0)"><rect class="pill-bg" width="80" height="28" rx="14"/><text x="40" y="18" class="pill-text" text-anchor="middle">OpenCV</text></g>
      <!-- Transformers -->
      <g transform="translate(506, 0)"><rect class="pill-bg pulse-pill" width="116" height="28" rx="14"/><text x="58" y="18" class="pill-text" text-anchor="middle">Transformers</text></g>
      <!-- HuggingFace -->
      <g transform="translate(630, 0)"><rect class="pill-bg" width="110" height="28" rx="14"/><text x="55" y="18" class="pill-text" text-anchor="middle">HuggingFace</text></g>
      <!-- LangChain -->
      <g transform="translate(748, 0)"><rect class="pill-bg pulse-pill" width="94" height="28" rx="14"/><text x="47" y="18" class="pill-text" text-anchor="middle">LangChain</text></g>

      <!-- Row 2 -->
      <!-- LangGraph -->
      <g transform="translate(0, 36)"><rect class="pill-bg pulse-pill" width="98" height="28" rx="14" stroke="#FF3CAC"/><text x="49" y="18" class="pill-text" fill="#FF3CAC" text-anchor="middle">LangGraph</text></g>
      <!-- CrewAI -->
      <g transform="translate(106, 36)"><rect class="pill-bg" width="76" height="28" rx="14"/><text x="38" y="18" class="pill-text" text-anchor="middle">CrewAI</text></g>
      <!-- OpenAI -->
      <g transform="translate(190, 36)"><rect class="pill-bg pulse-pill" width="78" height="28" rx="14"/><text x="39" y="18" class="pill-text" text-anchor="middle">OpenAI</text></g>
      <!-- Gemini -->
      <g transform="translate(276, 36)"><rect class="pill-bg" width="74" height="28" rx="14"/><text x="37" y="18" class="pill-text" text-anchor="middle">Gemini</text></g>
      <!-- Groq -->
      <g transform="translate(358, 36)"><rect class="pill-bg" width="64" height="28" rx="14"/><text x="32" y="18" class="pill-text" text-anchor="middle">Groq</text></g>
      <!-- Pandas -->
      <g transform="translate(430, 36)"><rect class="pill-bg" width="74" height="28" rx="14"/><text x="37" y="18" class="pill-text" text-anchor="middle">Pandas</text></g>
      <!-- NumPy -->
      <g transform="translate(512, 36)"><rect class="pill-bg" width="72" height="28" rx="14"/><text x="36" y="18" class="pill-text" text-anchor="middle">NumPy</text></g>
    </g>
  </g>

  <!-- Section 2: LANGUAGES -->
  <g transform="translate(30, 180)">
    <text x="0" y="0" class="cat-title" fill="#8B5CF6">💻 PROGRAMMING LANGUAGES</text>
    <g transform="translate(0, 15)">
      <!-- Python -->
      <g transform="translate(0, 0)"><rect class="pill-bg pulse-pill" width="80" height="28" rx="14" stroke="#00E5FF"/><text x="40" y="18" class="pill-text" fill="#00E5FF" text-anchor="middle">Python</text></g>
      <!-- C++ -->
      <g transform="translate(88, 0)"><rect class="pill-bg" width="64" height="28" rx="14"/><text x="32" y="18" class="pill-text" text-anchor="middle">C++</text></g>
      <!-- SQL -->
      <g transform="translate(160, 0)"><rect class="pill-bg" width="60" height="28" rx="14"/><text x="30" y="18" class="pill-text" text-anchor="middle">SQL</text></g>
      <!-- JavaScript -->
      <g transform="translate(228, 0)"><rect class="pill-bg" width="102" height="28" rx="14"/><text x="51" y="18" class="pill-text" text-anchor="middle">JavaScript</text></g>
    </g>
  </g>

  <!-- Section 3: BACKEND, CLOUD & DEVOPS -->
  <g transform="translate(380, 180)">
    <text x="0" y="0" class="cat-title" fill="#FF3CAC">☁️ BACKEND &amp; CLOUD ARCHITECTURE</text>
    <g transform="translate(0, 15)">
      <!-- FastAPI -->
      <g transform="translate(0, 0)"><rect class="pill-bg pulse-pill" width="76" height="28" rx="14"/><text x="38" y="18" class="pill-text" text-anchor="middle">FastAPI</text></g>
      <!-- Flask -->
      <g transform="translate(84, 0)"><rect class="pill-bg" width="62" height="28" rx="14"/><text x="31" y="18" class="pill-text" text-anchor="middle">Flask</text></g>
      <!-- Docker -->
      <g transform="translate(154, 0)"><rect class="pill-bg pulse-pill" width="72" height="28" rx="14"/><text x="36" y="18" class="pill-text" text-anchor="middle">Docker</text></g>
      <!-- Linux -->
      <g transform="translate(234, 0)"><rect class="pill-bg" width="64" height="28" rx="14"/><text x="32" y="18" class="pill-text" text-anchor="middle">Linux</text></g>
      <!-- AWS -->
      <g transform="translate(306, 0)"><rect class="pill-bg" width="60" height="28" rx="14"/><text x="30" y="18" class="pill-text" text-anchor="middle">AWS</text></g>
      <!-- MongoDB -->
      <g transform="translate(374, 0)"><rect class="pill-bg" width="88" height="28" rx="14"/><text x="44" y="18" class="pill-text" text-anchor="middle">MongoDB</text></g>

      <!-- Row 2 -->
      <g transform="translate(0, 36)"><rect class="pill-bg" width="86" height="28" rx="14"/><text x="43" y="18" class="pill-text" text-anchor="middle">Postgres</text></g>
      <g transform="translate(94, 36)"><rect class="pill-bg" width="66" height="28" rx="14"/><text x="33" y="18" class="pill-text" text-anchor="middle">Redis</text></g>
    </g>
  </g>

  <!-- Section 4: TOOLS -->
  <g transform="translate(30, 275)">
    <text x="0" y="0" class="cat-title" fill="#F8FAFC">🛠️ TOOLS &amp; WORKFLOWS</text>
    <g transform="translate(0, 15)">
      <g transform="translate(0, 0)"><rect class="pill-bg" width="54" height="28" rx="14"/><text x="27" y="18" class="pill-text" text-anchor="middle">Git</text></g>
      <g transform="translate(62, 0)"><rect class="pill-bg" width="70" height="28" rx="14"/><text x="35" y="18" class="pill-text" text-anchor="middle">GitHub</text></g>
      <g transform="translate(140, 0)"><rect class="pill-bg pulse-pill" width="70" height="28" rx="14"/><text x="35" y="18" class="pill-text" text-anchor="middle">MLflow</text></g>
      <g transform="translate(218, 0)"><rect class="pill-bg" width="76" height="28" rx="14"/><text x="38" y="18" class="pill-text" text-anchor="middle">Jupyter</text></g>
      <g transform="translate(302, 0)"><rect class="pill-bg" width="82" height="28" rx="14"/><text x="41" y="18" class="pill-text" text-anchor="middle">VS Code</text></g>
    </g>
  </g>
</svg>
