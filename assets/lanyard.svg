<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <defs>
    <linearGradient id="lanyard-strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#B28DFF"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#04070E" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0A1224" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0.4)"/>
      <stop offset="50%" stop-color="rgba(124, 92, 255, 0.2)"/>
      <stop offset="100%" stop-color="rgba(178, 141, 255, 0.4)"/>
    </linearGradient>

    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <radialGradient id="badge-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#04070E" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=Fira+Code:wght@500;600&amp;display=swap');
    text { font-family: 'Inter', -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }

    .sway-container {
      transform-origin: 400px 0px;
      animation: sway 6s ease-in-out infinite alternate;
    }
    @keyframes sway {
      0% { transform: rotate(-1.5deg) translateY(0px); }
      100% { transform: rotate(1.5deg) translateY(4px); }
    }

    .status-pulse {
      animation: pulseGreen 2s infinite alternate;
    }
    @keyframes pulseGreen {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Swaying Lanyard Group -->
  <g class="sway-container">
    <!-- Lanyard Strap Top hanging down -->
    <path d="M 370,0 L 385,90 L 415,90 L 430,0" fill="url(#lanyard-strap)" opacity="0.85"/>
    <path d="M 385,90 L 415,90 L 400,115 Z" fill="#7C5CFF"/>
    
    <!-- Metal Clip Ring -->
    <rect x="388" y="110" width="24" height="20" rx="4" fill="#94A3B8" stroke="#F8FAFC" stroke-width="1.5"/>
    <circle cx="400" cy="120" r="4" fill="#04070E"/>

    <!-- ID Card Body -->
    <g transform="translate(240, 125)" filter="url(#shadow)">
      <!-- Base Card Shape -->
      <rect x="0" y="0" width="320" height="300" rx="16" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.5"/>
      <rect x="1" y="1" width="318" height="298" rx="15" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <!-- Ambient Glow Behind Photo -->
      <rect x="0" y="0" width="320" height="300" rx="16" fill="url(#badge-glow)"/>

      <!-- Top Hole Clip cutout -->
      <rect x="135" y="10" width="50" height="8" rx="4" fill="#04070E" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

      <!-- Top Header Text -->
      <text x="160" y="42" fill="#4F8CFF" font-size="10" font-weight="800" letter-spacing="2" text-anchor="middle">AI RESEARCH LABORATORY</text>
      <line x1="20" y1="52" x2="300" y2="52" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

      <!-- Security Chip -->
      <rect x="25" y="65" width="40" height="30" rx="5" fill="url(#chip-grad)" stroke="#B8860B" stroke-width="1"/>
      <path d="M 45,65 L 45,95 M 25,80 L 65,80" stroke="#8B6508" stroke-width="1"/>

      <!-- Holographic Status -->
      <g transform="translate(195, 68)">
        <rect x="0" y="0" width="100" height="22" rx="11" fill="rgba(39, 201, 63, 0.12)" stroke="rgba(39, 201, 63, 0.4)" stroke-width="1"/>
        <circle cx="12" cy="11" r="3.5" fill="#27C93F" class="status-pulse"/>
        <text x="24" y="15" fill="#27C93F" font-size="9" font-weight="700" letter-spacing="1">CLEARED L5</text>
      </g>

      <!-- Center Avatar Circle / Frame -->
      <g transform="translate(160, 145)">
        <circle cx="0" cy="0" r="42" fill="#0A1224" stroke="url(#card-border)" stroke-width="2" filter="url(#glow-light)"/>
        <!-- Initials Avatar -->
        <circle cx="0" cy="0" r="38" fill="#04070E"/>
        <text x="0" y="8" fill="#F8FAFC" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1">VR</text>
      </g>

      <!-- Member Details -->
      <text x="160" y="210" fill="#F8FAFC" font-size="18" font-weight="900" letter-spacing="1" text-anchor="middle">VISHAL RATHOD</text>
      <text x="160" y="228" fill="#4F8CFF" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">AI ENGINEER</text>

      <line x1="40" y1="242" x2="280" y2="242" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Micro Info Grid -->
      <g transform="translate(30, 260)" class="mono" font-size="9">
        <text x="0" y="0" fill="#94A3B8">ID: <tspan fill="#F8FAFC">AI-7749-VR</tspan></text>
        <text x="130" y="0" fill="#94A3B8">LOC: <tspan fill="#F8FAFC">INDIA 🇮🇳</tspan></text>
        <text x="0" y="18" fill="#94A3B8">CORP: <tspan fill="#B28DFF">AI RESEARCH</tspan></text>
        <text x="130" y="18" fill="#94A3B8">EXP: <tspan fill="#27C93F">PERPETUAL</tspan></text>
      </g>
    </g>
  </g>
</svg>