<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <!-- Strap Gradient -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3CAC"/>
      <stop offset="50%" stop-color="#784BA0"/>
      <stop offset="100%" stop-color="#2B86C5"/>
    </linearGradient>

    <!-- Card Dark Glass Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Holographic Sheen -->
    <linearGradient id="holoSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#FF3CAC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .lanyard-swing {
      transform-origin: 160px 0px;
      animation: swing 4s ease-in-out infinite alternate;
    }
    @keyframes swing {
      0% { transform: rotate(-3.5deg); }
      100% { transform: rotate(3.5deg); }
    }

    .holo-pass {
      animation: holoMove 6s linear infinite alternate;
    }
    @keyframes holoMove {
      0% { opacity: 0.15; transform: translateY(-10px) skewY(-5deg); }
      100% { opacity: 0.4; transform: translateY(10px) skewY(5deg); }
    }

    .pulse-dot {
      animation: pulseDot 1.5s ease-in-out infinite alternate;
    }
    @keyframes pulseDot {
      0% { opacity: 0.4; r: 4px; }
      100% { opacity: 1; r: 6px; }
    }

    .title-name {
      font-family: 'Outfit', 'Inter', 'SF Pro Display', sans-serif;
      font-weight: 800;
      font-size: 20px;
      fill: #F8FAFC;
      letter-spacing: 1.5px;
    }
    .role-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #00E5FF;
      letter-spacing: 1px;
    }
    .detail-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      fill: #94A3B8;
    }
    .bold-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #8B5CF6;
    }
  </style>

  <g class="lanyard-swing">
    <!-- Lanyard Strap Top Anchor -->
    <path d="M 148 0 L 148 70 L 172 70 L 172 0 Z" fill="url(#strapGrad)"/>
    <text x="160" y="45" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 160 45)" letter-spacing="2">VISHAL_AI_OS</text>
    
    <!-- Metal Clip Ring -->
    <rect x="150" y="65" width="20" height="15" rx="3" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="160" cy="72" r="4" fill="#0F172A"/>

    <!-- ID Card Body -->
    <g transform="translate(35, 85)">
      <!-- Main Glass Card Container -->
      <rect x="0" y="0" width="250" height="380" rx="18" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="2" filter="url(#badgeGlow)"/>

      <!-- Holographic Overlay Sheen -->
      <rect class="holo-pass" x="2" y="2" width="246" height="376" rx="16" fill="url(#holoSheen)"/>

      <!-- Header Chip & Indicator -->
      <rect x="20" y="20" width="36" height="26" rx="4" fill="#1E293B" stroke="#00E5FF" stroke-width="1"/>
      <path d="M 20 33 H 56 M 38 20 V 46" stroke="#00E5FF" stroke-width="0.7" opacity="0.6"/>

      <!-- Status Indicator -->
      <circle class="pulse-dot" cx="222" cy="30" r="5" fill="#00E5FF" filter="url(#badgeGlow)"/>
      <text x="210" y="33" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00E5FF" text-anchor="end" font-weight="700">ONLINE</text>

      <!-- Avatar Silhouette / Holographic Portrait Ring -->
      <g transform="translate(125, 115)">
        <circle cx="0" cy="0" r="46" fill="#0F172A" stroke="url(#cardBorder)" stroke-width="2"/>
        <circle cx="0" cy="0" r="42" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 3"/>

        <!-- Cyberpunk Stylized AI Engineer Icon/Avatar -->
        <path d="M 0 -22 C -12 -22 -20 -14 -20 -2 C -20 8 -12 16 0 16 C 12 16 20 8 20 -2 C 20 -14 12 -22 0 -22 Z" fill="#1E293B"/>
        <!-- Glasses / Headset HUD -->
        <rect x="-14" y="-8" width="28" height="8" rx="2" fill="#00E5FF" opacity="0.9" filter="url(#badgeGlow)"/>
        <!-- Hair & Head Details -->
        <path d="M -16 -18 C -10 -26 10 -26 16 -18 C 12 -20 -12 -20 -16 -18 Z" fill="#8B5CF6"/>
        <!-- Shoulders / Cyber Suit -->
        <path d="M -30 36 C -30 20 -18 16 0 16 C 18 16 30 20 30 36 Z" fill="url(#cardBorder)"/>
      </g>

      <!-- Name & Title -->
      <text x="125" y="185" class="title-name" text-anchor="middle">VISHAL RATHOD</text>
      <rect x="45" y="195" width="160" height="22" rx="11" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
      <text x="125" y="210" class="role-badge" text-anchor="middle">AI &amp; ML ENGINEER</text>

      <!-- Security / Credentials Info -->
      <g transform="translate(25, 238)">
        <text x="0" y="0" class="detail-text">DEPT: <tspan class="bold-code">AI &amp; DATA SCIENCE</tspan></text>
        <text x="0" y="18" class="detail-text">INSTITUTE: <tspan class="bold-code">DAVV INDORE</tspan></text>
        <text x="0" y="36" class="detail-text">CLEARANCE: <tspan fill="#FF3CAC" font-weight="800">LEVEL 5 // AGENTIC</tspan></text>
        <text x="0" y="54" class="detail-text">GITHUB: <tspan fill="#00E5FF">@VishalRathod21</tspan></text>
      </g>

      <!-- Bottom Barcode & Security Hologram -->
      <g transform="translate(25, 315)">
        <rect x="0" y="0" width="200" height="30" fill="#F8FAFC" rx="4"/>
        <!-- Simulated Barcode Lines -->
        <path d="M 10 4 V 26 M 14 4 V 26 M 17 4 V 26 M 22 4 V 26 M 28 4 V 26 M 34 4 V 26 M 38 4 V 26 M 44 4 V 26 M 50 4 V 26 M 58 4 V 26 M 64 4 V 26 M 70 4 V 26 M 78 4 V 26 M 84 4 V 26 M 92 4 V 26 M 100 4 V 26 M 106 4 V 26 M 114 4 V 26 M 120 4 V 26 M 128 4 V 26 M 136 4 V 26 M 144 4 V 26 M 150 4 V 26 M 158 4 V 26 M 166 4 V 26 M 174 4 V 26 M 182 4 V 26 M 188 4 V 26" stroke="#050816" stroke-width="2"/>
        <text x="100" y="42" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B" text-anchor="middle">VR-2026-AI-AGENT-09</text>
      </g>
    </g>
  </g>
</svg>
