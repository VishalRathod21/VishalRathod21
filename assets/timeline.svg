<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="35%" stop-color="#7C5CFF"/>
      <stop offset="70%" stop-color="#B28DFF"/>
      <stop offset="100%" stop-color="#4F8CFF"/>
    </linearGradient>

    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(10, 18, 36, 0.85)"/>
      <stop offset="100%" stop-color="rgba(4, 7, 14, 0.95)"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0.3)"/>
      <stop offset="100%" stop-color="rgba(178, 141, 255, 0.1)"/>
    </linearGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=Fira+Code:wght@500;600&amp;display=swap');
    text { font-family: 'Inter', -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }

    /* Pulsing Timeline Node */
    .node-pulse {
      animation: pulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.35); opacity: 1; }
    }

    /* Flow Line Animation */
    .flow-dash {
      stroke-dasharray: 10;
      animation: flow 3s linear infinite;
    }
    @keyframes flow {
      to { stroke-dashoffset: -40; }
    }
  </style>

  <!-- Container -->
  <rect width="1000" height="580" rx="28" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Section Title -->
  <g transform="translate(500, 48)" text-anchor="middle">
    <rect x="-80" y="-22" width="160" height="26" rx="13" fill="rgba(79, 140, 255, 0.08)" stroke="rgba(79, 140, 255, 0.25)" stroke-width="1"/>
    <text x="0" y="-5" fill="#4F8CFF" font-size="10" font-weight="800" letter-spacing="2">EVOLUTIONARY PATHWAY</text>
    <text x="0" y="24" fill="#F8FAFC" font-size="28" font-weight="900" letter-spacing="2">ENGINEERING TIMELINE</text>
  </g>

  <!-- Vertical Optical Fiber Center Line -->
  <g transform="translate(500, 110)">
    <line x1="0" y1="0" x2="0" y2="420" stroke="url(#line-grad)" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="420" stroke="#F8FAFC" stroke-width="1.5" opacity="0.7" class="flow-dash"/>
  </g>

  <!-- TIMELINE STEPS -->

  <!-- STEP 1: 2024 - Machine Learning (LEFT) -->
  <g transform="translate(500, 130)">
    <!-- Node -->
    <circle cx="0" cy="0" r="16" fill="url(#node-glow)"/>
    <circle cx="0" cy="0" r="7" fill="#4F8CFF" class="node-pulse"/>
    
    <!-- Left Card -->
    <g transform="translate(-420, -42)">
      <rect width="380" height="84" rx="16" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.5"/>
      <text x="20" y="28" fill="#4F8CFF" font-size="12" font-weight="800" class="mono">2024</text>
      <text x="70" y="28" fill="#F8FAFC" font-size="16" font-weight="800">Machine Learning Foundations</text>
      <text x="20" y="52" fill="#94A3B8" font-size="12">Supervised/Unsupervised Learning, Regression, Classification</text>
      <text x="20" y="68" fill="#7C5CFF" font-size="11" font-weight="600">Scikit-Learn • Pandas • NumPy • Feature Engineering</text>
    </g>
  </g>

  <!-- STEP 2: 2025 - Deep Learning (RIGHT) -->
  <g transform="translate(500, 220)">
    <!-- Node -->
    <circle cx="0" cy="0" r="16" fill="url(#node-glow)"/>
    <circle cx="0" cy="0" r="7" fill="#7C5CFF" class="node-pulse" style="animation-delay: 0.5s;"/>
    
    <!-- Right Card -->
    <g transform="translate(40, -42)">
      <rect width="380" height="84" rx="16" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.5"/>
      <text x="20" y="28" fill="#7C5CFF" font-size="12" font-weight="800" class="mono">2025</text>
      <text x="70" y="28" fill="#F8FAFC" font-size="16" font-weight="800">Deep Learning Architectures</text>
      <text x="20" y="52" fill="#94A3B8" font-size="12">Neural Networks, CNNs, RNNs, Computer Vision, NLP</text>
      <text x="20" y="68" fill="#B28DFF" font-size="11" font-weight="600">PyTorch • TensorFlow • Model Optimization</text>
    </g>
  </g>

  <!-- STEP 3: 2026 - Generative AI (LEFT) -->
  <g transform="translate(500, 310)">
    <!-- Node -->
    <circle cx="0" cy="0" r="16" fill="url(#node-glow)"/>
    <circle cx="0" cy="0" r="7" fill="#B28DFF" class="node-pulse" style="animation-delay: 1.0s;"/>
    
    <!-- Left Card -->
    <g transform="translate(-420, -42)">
      <rect width="380" height="84" rx="16" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.5"/>
      <text x="20" y="28" fill="#B28DFF" font-size="12" font-weight="800" class="mono">2026</text>
      <text x="70" y="28" fill="#F8FAFC" font-size="16" font-weight="800">Generative AI &amp; RAG Systems</text>
      <text x="20" y="52" fill="#94A3B8" font-size="12">Large Language Models, Embeddings, Vector Databases</text>
      <text x="20" y="68" fill="#4F8CFF" font-size="11" font-weight="600">LangChain • LlamaIndex • Pinecone • OpenAI</text>
    </g>
  </g>

  <!-- STEP 4: 2027 - Agentic AI (RIGHT) -->
  <g transform="translate(500, 400)">
    <!-- Node -->
    <circle cx="0" cy="0" r="16" fill="url(#node-glow)"/>
    <circle cx="0" cy="0" r="7" fill="#4F8CFF" class="node-pulse" style="animation-delay: 1.5s;"/>
    
    <!-- Right Card -->
    <g transform="translate(40, -42)">
      <rect width="380" height="84" rx="16" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.5"/>
      <text x="20" y="28" fill="#4F8CFF" font-size="12" font-weight="800" class="mono">2027</text>
      <text x="70" y="28" fill="#F8FAFC" font-size="16" font-weight="800">Agentic AI &amp; Multi-Agent Swarms</text>
      <text x="20" y="52" fill="#94A3B8" font-size="12">Autonomous Workflows, Tool-Calling, Task Orchestration</text>
      <text x="20" y="68" fill="#7C5CFF" font-size="11" font-weight="600">LangGraph • CrewAI • AutoGen • Custom Agents</text>
    </g>
  </g>

  <!-- STEP 5: FUTURE - AI Engineer (CENTER END BADGE) -->
  <g transform="translate(500, 490)">
    <circle cx="0" cy="0" r="18" fill="url(#node-glow)"/>
    <circle cx="0" cy="0" r="8" fill="#27C93F" class="node-pulse" style="animation-delay: 2.0s;"/>
    
    <g transform="translate(-160, 20)">
      <rect width="320" height="42" rx="21" fill="rgba(39, 201, 63, 0.1)" stroke="rgba(39, 201, 63, 0.4)" stroke-width="1.5"/>
      <text x="160" y="26" fill="#27C93F" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">FUTURE: AI RESEARCH LEAD</text>
    </g>
  </g>
</svg>