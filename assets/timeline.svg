<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="1400" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'Fira Code', monospace; }

      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.6; }
      }
      .nodePulse { transform-origin: center; animation: pulseNode 2.5s infinite ease-in-out; }
    </style>

    <linearGradient id="timeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E"/>
      <stop offset="50%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="25%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#B28DFF"/>
      <stop offset="75%" stop-color="#27C93F"/>
      <stop offset="100%" stop-color="#4F8CFF"/>
    </linearGradient>

    <linearGradient id="glassBorderTime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.2)"/>
      <stop offset="100%" stop-color="rgba(79, 140, 255, 0.2)"/>
    </linearGradient>

    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="30" fill="url(#timeBg)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" fill="#4F8CFF" font-size="12" font-weight="700" class="mono" letter-spacing="2">CAREER EVOLUTION &amp; MILESTONES</text>
    <text x="0" y="26" fill="#F8FAFC" font-size="22" font-weight="800">ARTIFICIAL INTELLIGENCE JOURNEY</text>
  </g>

  <!-- Horizontal Timeline Bar -->
  <g transform="translate(60, 190)">
    <!-- Connecting Line -->
    <line x1="60" y1="0" x2="1220" y2="0" stroke="url(#lineGrad)" stroke-width="4" filter="url(#nodeGlow)"/>

    <!-- NODE 1: 2024 -->
    <g transform="translate(60, 0)">
      <circle cx="0" cy="0" r="14" fill="#04070E" stroke="#4F8CFF" stroke-width="4"/>
      <circle cx="0" cy="0" r="6" fill="#4F8CFF" class="nodePulse"/>

      <!-- Year Pill -->
      <rect x="-40" y="-70" width="80" height="30" rx="10" fill="rgba(79, 140, 255, 0.15)" stroke="rgba(79, 140, 255, 0.4)"/>
      <text x="0" y="-50" fill="#4F8CFF" font-size="14" font-weight="700" text-anchor="middle" class="mono">2024</text>

      <!-- Details Card -->
      <rect x="-100" y="30" width="200" height="85" rx="14" fill="rgba(10, 18, 36, 0.75)" stroke="url(#glassBorderTime)"/>
      <text x="0" y="55" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">Machine Learning</text>
      <text x="0" y="75" fill="#94A3B8" font-size="11" text-anchor="middle">Core Algorithms &amp; Statistics</text>
      <text x="0" y="95" fill="#4F8CFF" font-size="10" font-weight="600" text-anchor="middle" class="mono">Scikit-Learn • Pandas</text>
    </g>

    <!-- NODE 2: 2025 -->
    <g transform="translate(350, 0)">
      <circle cx="0" cy="0" r="14" fill="#04070E" stroke="#7C5CFF" stroke-width="4"/>
      <circle cx="0" cy="0" r="6" fill="#7C5CFF" class="nodePulse"/>

      <rect x="-40" y="-70" width="80" height="30" rx="10" fill="rgba(124, 92, 255, 0.15)" stroke="rgba(124, 92, 255, 0.4)"/>
      <text x="0" y="-50" fill="#7C5CFF" font-size="14" font-weight="700" text-anchor="middle" class="mono">2025</text>

      <rect x="-100" y="30" width="200" height="85" rx="14" fill="rgba(10, 18, 36, 0.75)" stroke="url(#glassBorderTime)"/>
      <text x="0" y="55" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">Deep Learning</text>
      <text x="0" y="75" fill="#94A3B8" font-size="11" text-anchor="middle">Neural Networks &amp; CNNs/RNNs</text>
      <text x="0" y="95" fill="#7C5CFF" font-size="10" font-weight="600" text-anchor="middle" class="mono">PyTorch • TensorFlow</text>
    </g>

    <!-- NODE 3: 2026 -->
    <g transform="translate(640, 0)">
      <circle cx="0" cy="0" r="16" fill="#04070E" stroke="#B28DFF" stroke-width="4"/>
      <circle cx="0" cy="0" r="7" fill="#B28DFF" class="nodePulse"/>

      <rect x="-40" y="-70" width="80" height="30" rx="10" fill="rgba(178, 141, 255, 0.2)" stroke="rgba(178, 141, 255, 0.5)"/>
      <text x="0" y="-50" fill="#B28DFF" font-size="14" font-weight="800" text-anchor="middle" class="mono">2026</text>

      <rect x="-100" y="30" width="200" height="85" rx="14" fill="rgba(10, 18, 36, 0.85)" stroke="#B28DFF" stroke-width="1.5"/>
      <text x="0" y="55" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">Generative AI</text>
      <text x="0" y="75" fill="#94A3B8" font-size="11" text-anchor="middle">LLMs, RAG &amp; Fine-Tuning</text>
      <text x="0" y="95" fill="#B28DFF" font-size="10" font-weight="600" text-anchor="middle" class="mono">LangChain • Llama-3</text>
    </g>

    <!-- NODE 4: 2027 -->
    <g transform="translate(930, 0)">
      <circle cx="0" cy="0" r="14" fill="#04070E" stroke="#27C93F" stroke-width="4"/>
      <circle cx="0" cy="0" r="6" fill="#27C93F" class="nodePulse"/>

      <rect x="-40" y="-70" width="80" height="30" rx="10" fill="rgba(39, 201, 63, 0.15)" stroke="rgba(39, 201, 63, 0.4)"/>
      <text x="0" y="-50" fill="#27C93F" font-size="14" font-weight="700" text-anchor="middle" class="mono">2027</text>

      <rect x="-100" y="30" width="200" height="85" rx="14" fill="rgba(10, 18, 36, 0.75)" stroke="url(#glassBorderTime)"/>
      <text x="0" y="55" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">Agentic AI</text>
      <text x="0" y="75" fill="#94A3B8" font-size="11" text-anchor="middle">Multi-Agent Systems &amp; MLOps</text>
      <text x="0" y="95" fill="#27C93F" font-size="10" font-weight="600" text-anchor="middle" class="mono">LangGraph • CrewAI</text>
    </g>

    <!-- NODE 5: FUTURE -->
    <g transform="translate(1220, 0)">
      <circle cx="0" cy="0" r="14" fill="#04070E" stroke="#4F8CFF" stroke-width="4"/>
      <circle cx="0" cy="0" r="6" fill="#4F8CFF" class="nodePulse"/>

      <rect x="-45" y="-70" width="90" height="30" rx="10" fill="rgba(79, 140, 255, 0.15)" stroke="rgba(79, 140, 255, 0.4)"/>
      <text x="0" y="-50" fill="#4F8CFF" font-size="13" font-weight="700" text-anchor="middle" class="mono">FUTURE</text>

      <rect x="-100" y="30" width="200" height="85" rx="14" fill="rgba(10, 18, 36, 0.75)" stroke="url(#glassBorderTime)"/>
      <text x="0" y="55" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">AI Product Leader</text>
      <text x="0" y="75" fill="#94A3B8" font-size="11" text-anchor="middle">Frontier AI Impact &amp; Scale</text>
      <text x="0" y="95" fill="#4F8CFF" font-size="10" font-weight="600" text-anchor="middle" class="mono">Global AI Innovations</text>
    </g>
  </g>
</svg>
