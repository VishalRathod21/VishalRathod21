<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="timeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="timeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="33%" stop-color="#8B5CF6"/>
      <stop offset="66%" stop-color="#FF3CAC"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Node Glow -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-header {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 800;
      fill: #F8FAFC;
      letter-spacing: 1.5px;
    }
    .year-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 900;
      fill: #00E5FF;
    }
    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #F8FAFC;
    }
    .card-desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #94A3B8;
    }
    .node-pulse {
      animation: pulseNode 2s ease-in-out infinite alternate;
    }
    @keyframes pulseNode {
      0% { r: 6px; opacity: 0.7; }
      100% { r: 10px; opacity: 1; }
    }
    .flowing-beam {
      stroke-dasharray: 200 400;
      animation: flowBeam 3s linear infinite;
    }
    @keyframes flowBeam {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#timeBg)" stroke="url(#timeBorder)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(30, 36)">
    <circle cx="0" cy="0" r="4" fill="#FF3CAC"/>
    <circle cx="12" cy="0" r="4" fill="#8B5CF6"/>
    <circle cx="24" cy="0" r="4" fill="#00E5FF"/>
    <text x="40" y="4" class="title-header">EVOLUTIONARY TIMELINE // CAREER ARCH ARCHITECTURE</text>
  </g>

  <!-- Connector Base Line -->
  <line x1="80" y1="130" x2="820" y2="130" stroke="#1E293B" stroke-width="4"/>

  <!-- Flowing Laser Connector Beam -->
  <line class="flowing-beam" x1="80" y1="130" x2="820" y2="130" stroke="url(#laserGrad)" stroke-width="4" filter="url(#nodeGlow)"/>

  <!-- Node 1: 2024 -->
  <g transform="translate(100, 130)">
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#00E5FF" stroke-width="2"/>
    <circle class="node-pulse" cx="0" cy="0" r="7" fill="#00E5FF" filter="url(#nodeGlow)"/>

    <!-- Top Year -->
    <text x="0" y="-30" class="year-title" text-anchor="middle">2024</text>
    <!-- Card Box -->
    <rect x="-80" y="25" width="160" height="52" rx="10" fill="#1E293B" stroke="#00E5FF" stroke-width="1"/>
    <text x="0" y="46" class="card-title" text-anchor="middle">Machine Learning</text>
    <text x="0" y="62" class="card-desc" text-anchor="middle">Foundations &amp; Analytics</text>
  </g>

  <!-- Node 2: 2025 -->
  <g transform="translate(340, 130)">
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
    <circle class="node-pulse" cx="0" cy="0" r="7" fill="#8B5CF6" filter="url(#nodeGlow)"/>

    <!-- Top Year -->
    <text x="0" y="-30" class="year-title" fill="#8B5CF6" text-anchor="middle">2025</text>
    <!-- Card Box -->
    <rect x="-80" y="25" width="160" height="52" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="46" class="card-title" text-anchor="middle">Deep Learning</text>
    <text x="0" y="62" class="card-desc" text-anchor="middle">NLP &amp; Computer Vision</text>
  </g>

  <!-- Node 3: 2026 (CURRENT) -->
  <g transform="translate(580, 130)">
    <circle cx="0" cy="0" r="16" fill="#0F172A" stroke="#FF3CAC" stroke-width="2.5"/>
    <circle class="node-pulse" cx="0" cy="0" r="9" fill="#FF3CAC" filter="url(#nodeGlow)"/>

    <!-- Top Year Badge -->
    <rect x="-35" y="-48" width="70" height="22" rx="11" fill="#FF3CAC"/>
    <text x="0" y="-33" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">2026★</text>
    
    <!-- Card Box -->
    <rect x="-85" y="25" width="170" height="56" rx="10" fill="#1E293B" stroke="#FF3CAC" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <text x="0" y="45" class="card-title" fill="#FF3CAC" text-anchor="middle">Generative AI &amp; LLMs</text>
    <text x="0" y="63" class="card-desc" fill="#00E5FF" text-anchor="middle">Agentic AI Systems</text>
  </g>

  <!-- Node 4: 2027 -->
  <g transform="translate(800, 130)">
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#00E5FF" stroke-width="2"/>
    <circle class="node-pulse" cx="0" cy="0" r="7" fill="#00E5FF" filter="url(#nodeGlow)"/>

    <!-- Top Year -->
    <text x="0" y="-30" class="year-title" text-anchor="middle">2027</text>
    <!-- Card Box -->
    <rect x="-75" y="25" width="150" height="52" rx="10" fill="#1E293B" stroke="#00E5FF" stroke-width="1"/>
    <text x="0" y="46" class="card-title" text-anchor="middle">Lead AI Engineer</text>
    <text x="0" y="62" class="card-desc" text-anchor="middle">Autonomous Systems</text>
  </g>
</svg>
