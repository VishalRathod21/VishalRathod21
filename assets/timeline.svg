<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E" />
      <stop offset="100%" stop-color="#0A1224" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF" />
      <stop offset="50%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#B28DFF" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Fira+Code:wght@400;500;700&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace; }

      @keyframes pulseNode {
        0%, 100% { r: 6px; opacity: 0.6; }
        50% { r: 10px; opacity: 1; }
      }

      @keyframes lineDash {
        to { stroke-dashoffset: -50; }
      }

      .node-pulse { animation: pulseNode 3s ease-in-out indefinite; }
      .flow-line { stroke-dasharray: 8 6; animation: lineDash 12s linear indefinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="30" fill="url(#bgGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text y="0" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="600" letter-spacing="3">EVOLUTIONARY TRAJECTORY</text>
    <text y="28" class="font-sans" fill="#F8FAFC" font-size="24" font-weight="800" letter-spacing="1">CAREER &amp; AI MILESTONES</text>
  </g>

  <!-- TIMELINE TRACK & NODES -->
  <g transform="translate(80, 180)">
    <!-- Main Horizontal Beam -->
    <line x1="60" y1="0" x2="980" y2="0" stroke="url(#lineGrad)" stroke-width="3" />
    <line x1="60" y1="0" x2="980" y2="0" stroke="url(#lineGrad)" stroke-width="6" opacity="0.4" class="flow-line" />

    <!-- MILESTONE 1: 2024 -->
    <g transform="translate(60, 0)">
      <circle cx="0" cy="0" r="16" fill="#04070E" stroke="#4F8CFF" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#4F8CFF" class="node-pulse" />
      <!-- Year Label Above -->
      <g transform="translate(0, -35)" text-anchor="middle">
        <rect x="-35" y="-14" width="70" height="22" rx="6" fill="rgba(79, 140, 255, 0.15)" stroke="rgba(79, 140, 255, 0.3)" />
        <text y="2" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="700">2024</text>
      </g>
      <!-- Details Below -->
      <g transform="translate(0, 35)" text-anchor="middle">
        <text y="0" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="700">Machine Learning</text>
        <text y="18" class="font-mono" fill="#94A3B8" font-size="11">Scikit-Learn • Data Pipelines</text>
      </g>
    </g>

    <!-- MILESTONE 2: 2025 -->
    <g transform="translate(290, 0)">
      <circle cx="0" cy="0" r="16" fill="#04070E" stroke="#6366F1" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#6366F1" class="node-pulse" />
      <g transform="translate(0, -35)" text-anchor="middle">
        <rect x="-35" y="-14" width="70" height="22" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
        <text y="2" class="font-mono" fill="#6366F1" font-size="12" font-weight="700">2025</text>
      </g>
      <g transform="translate(0, 35)" text-anchor="middle">
        <text y="0" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="700">Deep Learning</text>
        <text y="18" class="font-mono" fill="#94A3B8" font-size="11">PyTorch • Neural Nets</text>
      </g>
    </g>

    <!-- MILESTONE 3: 2026 -->
    <g transform="translate(520, 0)">
      <circle cx="0" cy="0" r="18" fill="#04070E" stroke="#7C5CFF" stroke-width="3" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="8" fill="#7C5CFF" class="node-pulse" />
      <g transform="translate(0, -38)" text-anchor="middle">
        <rect x="-40" y="-14" width="80" height="24" rx="6" fill="rgba(124, 92, 255, 0.2)" stroke="rgba(124, 92, 255, 0.5)" />
        <text y="2" class="font-mono" fill="#B28DFF" font-size="12" font-weight="700">2026 ★</text>
      </g>
      <g transform="translate(0, 35)" text-anchor="middle">
        <text y="0" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="800">Generative AI</text>
        <text y="18" class="font-mono" fill="#94A3B8" font-size="11">LLMs • RAG • Fine-Tuning</text>
      </g>
    </g>

    <!-- MILESTONE 4: 2027 -->
    <g transform="translate(750, 0)">
      <circle cx="0" cy="0" r="16" fill="#04070E" stroke="#B28DFF" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#B28DFF" class="node-pulse" />
      <g transform="translate(0, -35)" text-anchor="middle">
        <rect x="-35" y="-14" width="70" height="22" rx="6" fill="rgba(178, 141, 255, 0.15)" stroke="rgba(178, 141, 255, 0.3)" />
        <text y="2" class="font-mono" fill="#B28DFF" font-size="12" font-weight="700">2027</text>
      </g>
      <g transform="translate(0, 35)" text-anchor="middle">
        <text y="0" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="700">Agentic AI</text>
        <text y="18" class="font-mono" fill="#94A3B8" font-size="11">Multi-Agent Systems</text>
      </g>
    </g>

    <!-- MILESTONE 5: FUTURE -->
    <g transform="translate(980, 0)">
      <circle cx="0" cy="0" r="16" fill="#04070E" stroke="#4F8CFF" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#4F8CFF" class="node-pulse" />
      <g transform="translate(0, -35)" text-anchor="middle">
        <rect x="-40" y="-14" width="80" height="22" rx="6" fill="rgba(79, 140, 255, 0.15)" stroke="rgba(79, 140, 255, 0.3)" />
        <text y="2" class="font-mono" fill="#4F8CFF" font-size="12" font-weight="700">FUTURE</text>
      </g>
      <g transform="translate(0, 35)" text-anchor="middle">
        <text y="0" class="font-sans" fill="#F8FAFC" font-size="14" font-weight="700">AI Engineer</text>
        <text y="18" class="font-mono" fill="#94A3B8" font-size="11">Frontier AI Labs</text>
      </g>
    </g>
  </g>
</svg>
