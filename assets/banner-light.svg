<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Light AI Lab Palette & Gradients -->
    <linearGradient id="bgGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="primaryGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8">
        <animate attributeName="stop-color" values="#1D4ED8; #6366F1; #7C3AED; #1D4ED8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1; #7C3AED; #1D4ED8; #6366F1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED; #1D4ED8; #6366F1; #7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="volumetricLightLight1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="volumetricLightLight2" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glassBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.9)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.08)" />
    </linearGradient>

    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace, Consolas, monospace; }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(0.5deg); }
      }

      @keyframes pulseLight {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.4; }
      }

      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .ambient-pulse { animation: pulseLight 7s ease-in-out indefinite; }
      .blinking-cursor { animation: blinkCursor 1s step-end indefinite; }

      .type-line-1 { animation: fadeIn 0.5s 0.2s forwards; opacity: 0; }
      .type-line-2 { animation: fadeIn 0.5s 0.8s forwards; opacity: 0; }
      .type-line-3 { animation: fadeIn 0.5s 1.4s forwards; opacity: 0; }
      .type-line-4 { animation: fadeIn 0.5s 2.0s forwards; opacity: 0; }
      .type-line-5 { animation: fadeIn 0.5s 2.6s forwards; opacity: 0; }
      .type-ready  { animation: fadeIn 0.5s 3.2s forwards; opacity: 0; }
      .type-user   { animation: fadeIn 0.5s 3.8s forwards; opacity: 0; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="520" rx="30" fill="url(#bgGradientLight)" stroke="url(#glassBorderLight)" stroke-width="1.5" />

  <!-- Ambient Light Spheres -->
  <circle cx="200" cy="150" r="350" fill="url(#volumetricLightLight1)" class="ambient-pulse" />
  <circle cx="800" cy="350" r="400" fill="url(#volumetricLightLight2)" class="ambient-pulse" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#0F172A" stroke-width="1">
    <path d="M 0,100 H 1000 M 0,200 H 1000 M 0,300 H 1000 M 0,400 H 1000" />
    <path d="M 100,0 V 520 M 200,0 V 520 M 300,0 V 520 M 400,0 V 520 M 500,0 V 520 M 600,0 V 520 M 700,0 V 520 M 800,0 V 520 M 900,0 V 520" />
  </g>

  <!-- LEFT PANEL: Futuristic Interactive Terminal -->
  <g transform="translate(40, 55)">
    <!-- Window Frame -->
    <rect width="450" height="410" rx="20" fill="rgba(255, 255, 255, 0.85)" stroke="url(#glassBorderLight)" stroke-width="1.5" style="backdrop-filter: blur(20px);" />

    <!-- Window Header / Titlebar -->
    <rect width="450" height="42" rx="20" fill="rgba(0, 0, 0, 0.03)" />
    <circle cx="28" cy="21" r="5.5" fill="#EF4444" />
    <circle cx="46" cy="21" r="5.5" fill="#F59E0B" />
    <circle cx="64" cy="21" r="5.5" fill="#10B981" />
    <text x="90" y="25" class="font-mono" fill="#64748B" font-size="12" font-weight="500" letter-spacing="1">ai-root-terminal v4.2</text>

    <!-- Terminal Code / Output Lines -->
    <g transform="translate(28, 75)" class="font-mono" font-size="13">
      <text x="0" y="0" fill="#2563EB" font-weight="600" class="type-line-1">system@ai-lab:~# init --run</text>

      <text x="0" y="28" fill="#10B981" class="type-line-2">✓ Initializing AI Core...</text>
      <text x="0" y="52" fill="#10B981" class="type-line-3">✓ Loading Neural Networks...</text>
      <text x="0" y="76" fill="#10B981" class="type-line-4">✓ Mounting Agentic Models...</text>
      <text x="0" y="100" fill="#10B981" class="type-line-5">✓ Loading Project Repositories...</text>

      <text x="0" y="132" fill="#0F172A" font-weight="600" class="type-ready">➔ STATUS: <tspan fill="#10B981">AI System Online &amp; Ready</tspan></text>

      <!-- Prompt Line -->
      <g transform="translate(0, 168)" class="type-user">
        <text x="0" y="0" fill="#6366F1" font-weight="600">$ whoami</text>
        <text x="0" y="24" fill="#0F172A" font-weight="800" font-size="19">Vishal Rathod</text>
        <text x="0" y="46" fill="#475569" font-size="12" font-weight="500">AI &amp; Machine Learning Engineer</text>
        
        <!-- Interactive Pill Badges inside Terminal -->
        <g transform="translate(0, 60)">
          <rect width="92" height="24" rx="12" fill="rgba(37, 99, 235, 0.1)" stroke="rgba(37, 99, 235, 0.3)" stroke-width="1" />
          <text x="46" y="16" text-anchor="middle" class="font-sans" fill="#2563EB" font-size="10.5" font-weight="600">Deep Learning</text>

          <rect x="100" width="98" height="24" rx="12" fill="rgba(124, 58, 237, 0.1)" stroke="rgba(124, 58, 237, 0.3)" stroke-width="1" />
          <text x="149" y="16" text-anchor="middle" class="font-sans" fill="#7C3AED" font-size="10.5" font-weight="600">Generative AI</text>

          <rect x="206" width="85" height="24" rx="12" fill="rgba(99, 102, 241, 0.1)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
          <text x="248.5" y="16" text-anchor="middle" class="font-sans" fill="#6366F1" font-size="10.5" font-weight="600">Agentic AI</text>
        </g>

        <!-- Dynamic User Mission Statement Box -->
        <g transform="translate(0, 96)">
          <rect width="395" height="36" rx="8" fill="rgba(241, 245, 249, 0.8)" stroke="rgba(226, 232, 240, 0.9)" />
          <text x="12" y="15" class="font-mono" fill="#64748B" font-size="9.5">CURRENT MISSION:</text>
          <text x="12" y="28" class="font-sans" fill="#1E293B" font-size="10.5" font-weight="600">"Building intelligent systems that solve real-world problems."</text>
        </g>

        <!-- Blinking Prompt Cursor -->
        <rect x="80" y="-14" width="8" height="17" fill="#6366F1" class="blinking-cursor" />
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: HERO TITLE & BRANDING -->
  <g transform="translate(740, 260)">
    <!-- Animated Volumetric Glowing Backdrop -->
    <ellipse cx="0" cy="-40" rx="200" ry="75" fill="url(#primaryGradientLight)" opacity="0.15" filter="url(#softGlowLight)" />
    
    <!-- Main Name Title -->
    <text x="0" y="-30" text-anchor="middle" class="font-sans" fill="url(#primaryGradientLight)" font-size="42" font-weight="900" letter-spacing="4" filter="url(#softGlowLight)">VISHAL RATHOD</text>
    <text x="0" y="-30" text-anchor="middle" class="font-sans" fill="#0F172A" font-size="42" font-weight="900" letter-spacing="4">VISHAL RATHOD</text>

    <!-- Subtitle / Role Headline -->
    <text x="0" y="15" text-anchor="middle" class="font-sans" fill="#3B82F6" font-size="19" font-weight="800" letter-spacing="7">AI ENGINEER</text>

    <!-- Core Specializations Sub-line -->
    <g transform="translate(0, 48)" text-anchor="middle" class="font-mono" font-size="12" fill="#64748B" font-weight="500">
      <text x="0" y="0">LLMs <tspan fill="#3B82F6">•</tspan> Agentic Workflows <tspan fill="#3B82F6">•</tspan> MLOps</text>
    </g>

    <!-- Decorative Sci-Fi Target Ring & Crosshair -->
    <g transform="translate(0, 95)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.4" />
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#2563EB" stroke-width="1.5" opacity="0.4" />
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#2563EB" stroke-width="1.5" opacity="0.4" />
      <circle cx="0" cy="0" r="3" fill="#2563EB" />
    </g>

    <!-- Ambient Location / Status Pill -->
    <g transform="translate(0, 160)">
      <rect x="-165" y="-18" width="330" height="36" rx="18" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(37, 99, 235, 0.25)" stroke-width="1" />
      <circle cx="-140" cy="0" r="4" fill="#16A34A">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="10" y="4" class="font-sans" fill="#1E293B" font-size="11.5" font-weight="500" letter-spacing="1">LOCATION: INDIA  |  AVAILABLE FOR AI LABS</text>
    </g>
  </g>

  <!-- Bottom Accent Light Divider -->
  <line x1="60" y1="490" x2="940" y2="490" stroke="url(#primaryGradientLight)" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8 6" />
</svg>