<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="100%" height="700">
  <defs>
    <!-- Dark AI OS Canvas Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Glass Panel Background -->
    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Neon Gradient Borders -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Text Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Scanner Hologram Beam -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Loading Bar Gradient -->
    <linearGradient id="loadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- High Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Server Rack Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: 'Outfit', 'Inter', 'SF Pro Display', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }

    /* Typing Animation for Terminal Commands */
    .type-line-1 { animation: typeLine 0.8s steps(20) 0.2s forwards; opacity: 0; }
    .type-line-2 { animation: typeLine 0.8s steps(25) 1.0s forwards; opacity: 0; }
    .type-line-3 { animation: typeLine 0.8s steps(25) 1.8s forwards; opacity: 0; }
    .type-line-4 { animation: typeLine 0.8s steps(25) 2.6s forwards; opacity: 0; }
    .type-line-5 { animation: typeLine 0.8s steps(25) 3.4s forwards; opacity: 0; }

    @keyframes typeLine {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0px); }
    }

    /* Role Loop Typing Animation */
    .role-text-1 { animation: roleCycle1 12s infinite; }
    .role-text-2 { animation: roleCycle2 12s infinite; }
    .role-text-3 { animation: roleCycle3 12s infinite; }

    @keyframes roleCycle1 {
      0%, 30% { opacity: 1; transform: translateY(0); }
      33%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes roleCycle2 {
      0%, 32% { opacity: 0; transform: translateY(10px); }
      35%, 65% { opacity: 1; transform: translateY(0); }
      68%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes roleCycle3 {
      0%, 67% { opacity: 0; transform: translateY(10px); }
      70%, 97% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    /* Hologram Scanner Line Loop */
    .scanner-line {
      animation: scanMove 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes scanMove {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(480px); opacity: 0; }
    }

    /* Neon Sign Flicker */
    .neon-flicker {
      animation: flicker 4s ease-in-out infinite alternate;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #00E5FF); }
      50% { opacity: 0.8; filter: drop-shadow(0 0 3px #00E5FF); }
      52% { opacity: 0.4; }
      54% { opacity: 0.9; }
    }

    /* Loading Bar Animation */
    .loading-bar-fill {
      animation: barFill 3.5s ease-out infinite;
    }
    @keyframes barFill {
      0% { width: 0px; }
      100% { width: 580px; }
    }

    /* Floating Tech Icons Animation */
    .float-icon-1 { animation: floatIcon 4s ease-in-out infinite alternate; }
    .float-icon-2 { animation: floatIcon 5s ease-in-out 1s infinite alternate; }
    .float-icon-3 { animation: floatIcon 4.5s ease-in-out 0.5s infinite alternate; }

    @keyframes floatIcon {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(3deg); }
    }

    /* Cursor Blinking */
    .cursor-blink { animation: blink 1s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    /* Matrix Digital Rain Animation */
    .digital-rain { animation: rainDrop 6s linear infinite; opacity: 0.35; }
    @keyframes rainDrop {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(700px); }
    }
  </style>

  <!-- Base Dark Background -->
  <rect width="1400" height="700" fill="url(#bgDark)"/>
  <rect width="1400" height="700" fill="url(#gridPattern)"/>

  <!-- Background Server Racks & Ambient Lights -->
  <g opacity="0.25">
    <line x1="900" y1="0" x2="900" y2="700" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="1150" y1="0" x2="1150" y2="700" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="1350" y1="0" x2="1350" y2="700" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Server LED Indicators -->
    <circle cx="920" cy="100" r="3" fill="#00E5FF" class="cursor-blink"/>
    <circle cx="920" cy="120" r="3" fill="#8B5CF6"/>
    <circle cx="920" cy="140" r="3" fill="#FF3CAC"/>
    <circle cx="1170" cy="200" r="3" fill="#00E5FF"/>
    <circle cx="1170" cy="220" r="3" fill="#8B5CF6" class="cursor-blink"/>
  </g>

  <!-- Digital Rain / Code Matrix (Background) -->
  <g class="font-mono" font-size="10" fill="#00E5FF">
    <text class="digital-rain" x="850" y="0">0101010101010101</text>
    <text class="digital-rain" x="980" y="-150" style="animation-delay: 2s;">1010111001010101</text>
    <text class="digital-rain" x="1200" y="-80" style="animation-delay: 4s;">1100101010100101</text>
  </g>

  <!-- Floating Neural Nodes & Ambient Beams -->
  <g opacity="0.3" filter="url(#glow)">
    <circle cx="200" cy="150" r="180" fill="#00E5FF" opacity="0.08"/>
    <circle cx="1100" cy="350" r="220" fill="#8B5CF6" opacity="0.1"/>
    <circle cx="700" cy="550" r="160" fill="#FF3CAC" opacity="0.06"/>
  </g>

  <!-- ========================================================= -->
  <!-- LEFT SIDE: TERMINAL, NAME, ROLE, MISSION, CODE, NEON      -->
  <!-- ========================================================= -->

  <!-- Top Glass Terminal Window (Commands & Boot Loader) -->
  <g transform="translate(50, 45)">
    <!-- Terminal Box -->
    <rect x="0" y="0" width="620" height="210" rx="14" fill="url(#glassPanel)" stroke="url(#neonBorder)" stroke-width="1.5" filter="url(#softGlow)"/>

    <!-- Terminal Header Buttons -->
    <circle cx="22" cy="20" r="5" fill="#FF3CAC"/>
    <circle cx="38" cy="20" r="5" fill="#8B5CF6"/>
    <circle cx="54" cy="20" r="5" fill="#00E5FF"/>
    <text x="75" y="24" class="font-mono" font-size="11" fill="#475569" font-weight="600">ai_os_core_v4.2.sh — bash — 80x24</text>

    <!-- Terminal Content Commands -->
    <g transform="translate(20, 52)" class="font-mono" font-size="12">
      <text x="0" y="0" fill="#00E5FF" font-weight="700">&gt; boot ai_core</text>
      <text class="type-line-1" x="0" y="20" fill="#475569">[SYS] Initializing AI Engine...</text>
      <text class="type-line-2" x="0" y="38" fill="#475569">[SYS] Loading Neural Network &amp; Models...</text>
      <text class="type-line-3" x="0" y="56" fill="#8B5CF6">[SYS] Connecting Agentic Pipeline (LangGraph/CrewAI)...</text>
      <text class="type-line-4" x="0" y="74" fill="#00E5FF" font-weight="700">[AUTH] Authentication Success // Clearance Level 5</text>
      <text class="type-line-5" x="0" y="92" fill="#FF3CAC" font-weight="800">Welcome Vishal Rathod to AI OS</text>
    </g>

    <!-- Terminal Loading Bar -->
    <g transform="translate(20, 168)">
      <text x="0" y="-8" class="font-mono" font-size="10" fill="#00E5FF" font-weight="700">LOADING CORE PIPELINE [100%]</text>
      <rect x="0" y="0" width="580" height="12" rx="6" fill="#CBD5E1"/>
      <rect class="loading-bar-fill" x="0" y="0" width="580" height="12" rx="6" fill="url(#loadGrad)" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- Big Name Display: VISHAL RATHOD -->
  <g transform="translate(50, 310)">
    <text x="0" y="0" class="font-sans" font-size="54" font-weight="900" fill="url(#nameGrad)" letter-spacing="3" filter="url(#glow)">VISHAL RATHOD</text>
  </g>

  <!-- Role Cycling Text (Typing Loop) -->
  <g transform="translate(50, 350)">
    <rect x="0" y="-22" width="16" height="26" fill="#00E5FF" rx="3" opacity="0.3"/>
    <text x="24" y="0" class="font-mono role-text-1" font-size="20" font-weight="700" fill="#00E5FF">⚡ AI ENGINEER &amp; AGENTIC BUILDER</text>
    <text x="24" y="0" class="font-mono role-text-2" font-size="20" font-weight="700" fill="#8B5CF6">🧠 MACHINE LEARNING &amp; GENAI ARCHITECT</text>
    <text x="24" y="0" class="font-mono role-text-3" font-size="20" font-weight="700" fill="#FF3CAC">🚀 OPEN SOURCE AI CONTRIBUTOR</text>
  </g>

  <!-- Mission Statement -->
  <g transform="translate(50, 385)">
    <text x="0" y="0" class="font-sans" font-size="15" fill="#475569" font-weight="500" letter-spacing="0.5">
      🎯 <tspan fill="#0F172A" font-weight="700">Mission:</tspan> Build autonomous AI systems &amp; intelligent agentic workflows that solve real-world complex problems.
    </text>
  </g>

  <!-- About Card ($ whoami terminal card) -->
  <g transform="translate(50, 415)">
    <rect x="0" y="0" width="340" height="135" rx="12" fill="url(#glassPanel)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(16, 26)" class="font-mono" font-size="11">
      <text x="0" y="0" fill="#00E5FF" font-weight="700">$ whoami</text>
      <text x="90" y="0" fill="#0F172A">AI Engineer &amp; ML Specialist</text>

      <text x="0" y="24" fill="#8B5CF6" font-weight="700">$ currently</text>
      <text x="90" y="24" fill="#0F172A">Building Multi-Agent Platforms</text>

      <text x="0" y="48" fill="#FF3CAC" font-weight="700">$ learning</text>
      <text x="90" y="48" fill="#00E5FF">LangGraph • LLMs • RAG • AWS</text>

      <text x="0" y="72" fill="#475569" font-weight="700">$ edu</text>
      <text x="90" y="72" fill="#0F172A">M.Tech AI &amp; DS (DAVV Indore)</text>
    </g>
  </g>

  <!-- Code Window (Glass Code Editor) -->
  <g transform="translate(410, 415)">
    <rect x="0" y="0" width="260" height="135" rx="12" fill="url(#glassPanel)" stroke="url(#neonBorder)" stroke-width="1"/>
    <!-- File tab -->
    <rect x="12" y="10" width="90" height="18" rx="4" fill="#CBD5E1"/>
    <text x="20" y="22" class="font-mono" font-size="9" fill="#00E5FF">buildDreams.js</text>

    <g transform="translate(14, 46)" class="font-mono" font-size="11">
      <text x="0" y="0" fill="#FF3CAC" font-weight="700">function <tspan fill="#00E5FF">buildDreams</tspan>() {</text>
      <text x="14" y="18" fill="#8B5CF6">learn<tspan fill="#0F172A">();</tspan></text>
      <text x="14" y="34" fill="#8B5CF6">build<tspan fill="#0F172A">();</tspan></text>
      <text x="14" y="50" fill="#8B5CF6">deploy<tspan fill="#0F172A">();</tspan></text>
      <text x="14" y="66" fill="#8B5CF6">repeat<tspan fill="#0F172A">();</tspan></text>
      <text x="0" y="82" fill="#FF3CAC" font-weight="700">}</text>
    </g>
  </g>

  <!-- Neon Sign Badge ($ KEEP CODING • KEEP BUILDING) -->
  <g transform="translate(50, 570)" class="neon-flicker">
    <rect x="0" y="0" width="620" height="42" rx="21" fill="#E2E8F0" stroke="#00E5FF" stroke-width="1.5" filter="url(#glow)"/>
    <text x="310" y="26" class="font-mono" font-size="13" font-weight="800" fill="#00E5FF" text-anchor="middle" letter-spacing="2">
      ⚡ KEEP CODING • KEEP BUILDING • INNOVATE ALWAYS ⚡
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT SIDE: ANIME AI CHARACTER & HOLOGRAM & TECH ICONS     -->
  <!-- ========================================================= -->

  <g transform="translate(760, 50)">
    <!-- Outer Holographic Pod Ring -->
    <ellipse cx="280" cy="270" rx="240" ry="260" fill="none" stroke="url(#neonBorder)" stroke-width="1.5" opacity="0.4" stroke-dasharray="10 6"/>

    <!-- Anime Sci-Fi AI Engineer Character Graphics -->
    <g transform="translate(100, 40)">
      <!-- Cyber Holographic Aura -->
      <circle cx="180" cy="200" r="160" fill="#E2E8F0" stroke="url(#neonBorder)" stroke-width="2" filter="url(#glow)"/>
      <circle cx="180" cy="200" r="150" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="5 5" opacity="0.6"/>

      <!-- Anime Character Head & Hair Silhouette -->
      <path d="M 180 80 C 130 80 110 130 110 180 C 110 240 130 270 180 270 C 230 270 250 240 250 180 C 250 130 230 80 180 80 Z" fill="#CBD5E1" stroke="#8B5CF6" stroke-width="2"/>
      <!-- Anime Spiky Hair -->
      <path d="M 120 140 Q 90 90 140 70 Q 180 40 220 70 Q 270 90 240 140 Q 210 100 180 110 Q 150 100 120 140 Z" fill="#8B5CF6" opacity="0.9" filter="url(#softGlow)"/>
      
      <!-- Cyber Visor / HUD Glasses -->
      <path d="M 125 160 L 235 160 L 225 190 L 135 190 Z" fill="#00E5FF" opacity="0.9" filter="url(#glow)"/>
      <line x1="120" y1="175" x2="240" y2="175" stroke="#FF3CAC" stroke-width="2" filter="url(#glow)"/>
      <!-- Glowing Eye Lines under Visor -->
      <circle cx="155" cy="175" r="4" fill="#FFFFFF" filter="url(#glow)"/>
      <circle cx="205" cy="175" r="4" fill="#FFFFFF" filter="url(#glow)"/>

      <!-- Neural Headset Interface -->
      <rect x="98" y="150" width="14" height="40" rx="4" fill="#FF3CAC" filter="url(#glow)"/>
      <rect x="248" y="150" width="14" height="40" rx="4" fill="#FF3CAC" filter="url(#glow)"/>

      <!-- Cyber Jacket / Suit Shoulders -->
      <path d="M 60 400 C 60 280 110 250 180 250 C 250 250 300 280 300 400 Z" fill="url(#glassPanel)" stroke="url(#neonBorder)" stroke-width="2"/>
      <!-- Collar & Neck Hardware -->
      <path d="M 140 250 L 180 290 L 220 250 Z" fill="#E2E8F0" stroke="#00E5FF" stroke-width="1.5"/>
      <!-- Glowing Core Chest Light -->
      <circle cx="180" cy="330" r="16" fill="#00E5FF" opacity="0.9" filter="url(#glow)"/>
      <polygon points="180,318 190,336 170,336" fill="#FFFFFF" filter="url(#glow)"/>
    </g>

    <!-- Horizontal Holographic Scanner Line -->
    <rect class="scanner-line" x="30" y="0" width="500" height="12" fill="url(#scanBeam)" filter="url(#glow)"/>

    <!-- Floating Tech Stack Badges around Character -->
    <!-- Python -->
    <g class="float-icon-1" transform="translate(20, 80)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="#E2E8F0" stroke="#00E5FF" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="40" y="19" class="font-mono" font-size="11" font-weight="700" fill="#00E5FF" text-anchor="middle">Python</text>
    </g>

    <!-- PyTorch -->
    <g class="float-icon-2" transform="translate(420, 100)">
      <rect x="0" y="0" width="84" height="30" rx="15" fill="#E2E8F0" stroke="#FF3CAC" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="42" y="19" class="font-mono" font-size="11" font-weight="700" fill="#FF3CAC" text-anchor="middle">PyTorch</text>
    </g>

    <!-- Docker -->
    <g class="float-icon-3" transform="translate(10, 240)">
      <rect x="0" y="0" width="76" height="30" rx="15" fill="#E2E8F0" stroke="#8B5CF6" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="38" y="19" class="font-mono" font-size="11" font-weight="700" fill="#8B5CF6" text-anchor="middle">Docker</text>
    </g>

    <!-- FastAPI -->
    <g class="float-icon-1" transform="translate(430, 260)">
      <rect x="0" y="0" width="80" height="30" rx="15" fill="#E2E8F0" stroke="#00E5FF" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="40" y="19" class="font-mono" font-size="11" font-weight="700" fill="#00E5FF" text-anchor="middle">FastAPI</text>
    </g>

    <!-- LangChain -->
    <g class="float-icon-2" transform="translate(30, 420)">
      <rect x="0" y="0" width="94" height="30" rx="15" fill="#E2E8F0" stroke="#FF3CAC" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="47" y="19" class="font-mono" font-size="11" font-weight="700" fill="#FF3CAC" text-anchor="middle">LangChain</text>
    </g>

    <!-- MongoDB -->
    <g class="float-icon-3" transform="translate(410, 430)">
      <rect x="0" y="0" width="86" height="30" rx="15" fill="#E2E8F0" stroke="#8B5CF6" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="43" y="19" class="font-mono" font-size="11" font-weight="700" fill="#8B5CF6" text-anchor="middle">MongoDB</text>
    </g>
  </g>
</svg>