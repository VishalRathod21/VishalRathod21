<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="100%" height="100%">
  <defs>
    <!-- Light AI Lab Palette & Gradients -->
    <linearGradient id="bgGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="primaryGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8">
        <animate attributeName="stop-color" values="#1D4ED8; #6366F1; #7C3AED; #1D4ED8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1; #7C3AED; #1D4ED8; #6366F1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED; #1D4ED8; #6366F1; #7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="volumetricLightLight1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="volumetricLightLight2" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glassBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.9)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.06)" />
    </linearGradient>

    <linearGradient id="scanlineGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(37, 99, 235, 0)" />
      <stop offset="50%" stop-color="rgba(124, 58, 237, 0.4)" />
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0)" />
    </linearGradient>

    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace, Consolas, monospace; }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }

      @keyframes pulseLight {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.4; }
      }

      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(320px); opacity: 0; }
      }

      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .ambient-pulse { animation: pulseLight 7s ease-in-out indefinite; }
      .scanner-line { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) indefinite; }
      .blinking-cursor { animation: blinkCursor 1s step-end indefinite; }

      .type-line-1 { animation: fadeIn 0.5s 0.2s forwards; opacity: 0; }
      .type-line-2 { animation: fadeIn 0.5s 0.8s forwards; opacity: 0; }
      .type-line-3 { animation: fadeIn 0.5s 1.4s forwards; opacity: 0; }
      .type-line-4 { animation: fadeIn 0.5s 2.0s forwards; opacity: 0; }
      .type-line-5 { animation: fadeIn 0.5s 2.6s forwards; opacity: 0; }
      .type-ready  { animation: fadeIn 0.5s 3.2s forwards; opacity: 0; }
      .type-user   { animation: fadeIn 0.5s 3.8s forwards; opacity: 0; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1400" height="700" rx="40" fill="url(#bgGradientLight)" stroke="url(#glassBorderLight)" stroke-width="1.5" />

  <!-- Ambient Light Spheres -->
  <circle cx="250" cy="200" r="400" fill="url(#volumetricLightLight1)" class="ambient-pulse" />
  <circle cx="1150" cy="350" r="450" fill="url(#volumetricLightLight2)" class="ambient-pulse" />

  <!-- Grid Overlay -->
  <g opacity="0.05" stroke="#2563EB" stroke-width="1">
    <pattern id="gridLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1400" height="700" fill="url(#gridLight)" />
  </g>

  <!-- LEFT PANEL: Terminal Light -->
  <g transform="translate(60, 110)">
    <rect width="410" height="480" rx="24" fill="rgba(255, 255, 255, 0.75)" stroke="url(#glassBorderLight)" stroke-width="1.5" style="backdrop-filter: blur(20px);" />
    
    <!-- Terminal Header -->
    <rect width="410" height="42" rx="24" fill="rgba(0, 0, 0, 0.03)" />
    <circle cx="28" cy="21" r="5.5" fill="#FF5F56" />
    <circle cx="46" cy="21" r="5.5" fill="#FFBD2E" />
    <circle cx="64" cy="21" r="5.5" fill="#27C93F" />
    <text x="205" y="26" text-anchor="middle" class="font-mono" fill="#64748B" font-size="12" font-weight="500" letter-spacing="1">ai-core-terminal v4.2</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 75)" class="font-mono" font-size="12">
      <g fill="#475569">
        <text y="0" class="type-line-1"><tspan fill="#2563EB">system@ai-lab:~#</tspan> init --core</text>
        <text y="24" class="type-line-2"><tspan fill="#6366F1">✓</tspan> Initializing AI Core...</text>
        <text y="48" class="type-line-3"><tspan fill="#6366F1">✓</tspan> Loading Neural Networks...</text>
        <text y="72" class="type-line-4"><tspan fill="#6366F1">✓</tspan> Loading Agentic Models...</text>
        <text y="96" class="type-line-5"><tspan fill="#6366F1">✓</tspan> Loading Project Repositories...</text>
        <text y="124" class="type-ready" font-weight="600"><tspan fill="#16A34A">● STATUS:</tspan> AI System Online &amp; Ready</text>
      </g>

      <line x1="0" y1="145" x2="362" y2="145" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />

      <g transform="translate(0, 170)" class="type-user">
        <text y="0"><tspan fill="#2563EB">$ whoami</tspan></text>
        <text y="26" fill="#0F172A" font-size="14" font-weight="600">Vishal Rathod</text>
        <text y="48" fill="#7C3AED" font-size="12">AI &amp; Machine Learning Engineer</text>

        <g transform="translate(0, 70)">
          <rect x="0" y="0" width="105" height="22" rx="6" fill="rgba(37, 99, 235, 0.1)" stroke="rgba(37, 99, 235, 0.3)" />
          <text x="52" y="15" text-anchor="middle" fill="#2563EB" font-size="10">Deep Learning</text>

          <rect x="113" y="0" width="105" height="22" rx="6" fill="rgba(99, 102, 241, 0.1)" stroke="rgba(99, 102, 241, 0.3)" />
          <text x="165" y="15" text-anchor="middle" fill="#6366F1" font-size="10">Generative AI</text>

          <rect x="226" y="0" width="105" height="22" rx="6" fill="rgba(124, 58, 237, 0.1)" stroke="rgba(124, 58, 237, 0.3)" />
          <text x="278" y="15" text-anchor="middle" fill="#7C3AED" font-size="10">Agentic AI</text>
        </g>

        <g transform="translate(0, 120)">
          <text y="0" fill="#64748B" font-size="10" letter-spacing="1">CURRENT MISSION</text>
          <text y="20" fill="#334155" font-size="11" font-family="'Inter', sans-serif">"Building intelligent AI systems that</text>
          <text y="36" fill="#334155" font-size="11" font-family="'Inter', sans-serif">solve real-world problems."</text>
        </g>
      </g>

      <rect x="75" y="170" width="7" height="14" fill="#2563EB" class="blinking-cursor" />
    </g>
  </g>

  <!-- CENTER PANEL -->
  <g transform="translate(700, 270)" text-anchor="middle">
    <g transform="translate(0, -60)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(0, 0, 0, 0.04)" stroke="url(#glassBorderLight)" stroke-width="1" />
      <text y="4" class="font-mono" fill="#2563EB" font-size="11" font-weight="500" letter-spacing="3">RESEARCH &amp; DEVELOPMENT</text>
    </g>

    <text y="45" class="font-sans" font-size="58" font-weight="900" letter-spacing="6" fill="url(#primaryGradientLight)" filter="url(#softGlowLight)">
      VISHAL RATHOD
    </text>
    <text y="45" class="font-sans" font-size="58" font-weight="900" letter-spacing="6" fill="url(#primaryGradientLight)">
      VISHAL RATHOD
    </text>

    <text y="92" class="font-sans" fill="#0F172A" font-size="20" font-weight="600" letter-spacing="8" opacity="0.95">
      AI ENGINEER
    </text>

    <g transform="translate(0, 130)" class="font-mono" fill="#64748B" font-size="12" letter-spacing="1">
      <text y="0">
        <tspan fill="#2563EB">LLMs</tspan>  •  
        <tspan fill="#6366F1">Agentic Workflows</tspan>  •  
        <tspan fill="#7C3AED">MLOps</tspan>
      </text>
    </g>

    <g transform="translate(0, 180)">
      <rect x="-160" y="-18" width="320" height="36" rx="18" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(37, 99, 235, 0.25)" stroke-width="1" />
      <circle cx="-135" cy="0" r="4" fill="#16A34A">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="10" y="4" class="font-sans" fill="#1E293B" font-size="12" font-weight="500" letter-spacing="1">LOCATION: INDIA  |  AVAILABLE FOR AI LABS</text>
    </g>
  </g>

  <!-- RIGHT PANEL -->
  <g transform="translate(940, 110)">
    <rect width="400" height="480" rx="24" fill="rgba(255, 255, 255, 0.75)" stroke="url(#glassBorderLight)" stroke-width="1.5" style="backdrop-filter: blur(20px);" />

    <rect width="400" height="42" rx="24" fill="rgba(0, 0, 0, 0.03)" />
    <text x="28" y="26" class="font-mono" fill="#64748B" font-size="11" font-weight="500" letter-spacing="1.5">NEURAL PROFILE // VISUALIZER</text>
    <circle cx="368" cy="21" r="4" fill="#2563EB" />

    <g transform="translate(30, 65)">
      <g transform="translate(20, 20)">
        <clipPath id="avatarClipLight">
          <rect width="300" height="320" rx="16" />
        </clipPath>
        
        <rect width="300" height="320" rx="16" fill="#E2E8F0" stroke="rgba(0,0,0,0.1)" />
        <image href="profile.png" width="300" height="320" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClipLight)" opacity="0.9" />

        <rect width="300" height="40" fill="url(#scanlineGradLight)" class="scanner-line" clip-path="url(#avatarClipLight)" />
        
        <path d="M 0,20 L 0,0 L 20,0" fill="none" stroke="#2563EB" stroke-width="2" />
        <path d="M 280,0 L 300,0 L 300,20" fill="none" stroke="#2563EB" stroke-width="2" />
        <path d="M 0,300 L 0,320 L 20,320" fill="none" stroke="#6366F1" stroke-width="2" />
        <path d="M 280,320 L 300,320 L 300,300" fill="none" stroke="#6366F1" stroke-width="2" />
      </g>

      <g transform="translate(20, 365)" class="font-mono" font-size="11" fill="#64748B">
        <text x="0" y="0">MODEL: <tspan fill="#0F172A">GEN-AI / AGENTIC</tspan></text>
        <text x="180" y="0">LATENCY: <tspan fill="#16A34A">12ms</tspan></text>
        <text x="0" y="20">CORE: <tspan fill="#2563EB">PYTORCH / CUDA</tspan></text>
        <text x="180" y="20">ACCURACY: <tspan fill="#7C3AED">99.8%</tspan></text>
      </g>
    </g>
  </g>
</svg>