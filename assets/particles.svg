<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" width="1400" height="300">
  <defs>
    <style>
      @keyframes floatP1 { 0%, 100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-20px) translateX(15px); } }
      @keyframes floatP2 { 0%, 100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(25px) translateX(-20px); } }
      .p1 { animation: floatP1 8s ease-in-out infinite; }
      .p2 { animation: floatP2 10s ease-in-out infinite 1s; }
    </style>
    <radialGradient id="pGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0.25)"/>
      <stop offset="100%" stop-color="rgba(4, 7, 14, 0)"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="300" rx="20" fill="#04070E"/>
  <rect width="1400" height="300" fill="url(#pGlow)"/>
  <g class="p1">
    <circle cx="100" cy="80" r="3" fill="#4F8CFF" opacity="0.6"/>
    <circle cx="400" cy="220" r="2" fill="#7C5CFF" opacity="0.8"/>
    <circle cx="900" cy="90" r="2.5" fill="#B28DFF" opacity="0.7"/>
    <circle cx="1300" cy="250" r="3" fill="#4F8CFF" opacity="0.5"/>
  </g>
  <g class="p2">
    <circle cx="250" cy="240" r="2" fill="#B28DFF" opacity="0.7"/>
    <circle cx="650" cy="110" r="3" fill="#4F8CFF" opacity="0.6"/>
    <circle cx="1150" cy="70" r="2" fill="#7C5CFF" opacity="0.8"/>
  </g>
</svg>