<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300">
  <defs>
    <!-- Dark Background -->
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Particles Glow Filter -->
    <filter id="pGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .p-node {
      animation: floatUp 8s ease-in-out infinite alternate;
    }
    .p-node-2 {
      animation: floatDown 10s ease-in-out infinite alternate;
    }
    .p-pulse {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes floatUp {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      100% { transform: translateY(-30px) translateX(15px); opacity: 0.9; }
    }
    @keyframes floatDown {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      100% { transform: translateY(30px) translateX(-20px); opacity: 1; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; r: 3px; }
      100% { opacity: 0.9; r: 6px; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="300" fill="url(#pBg)"/>
  <!-- Sci-Fi Grid Overlay -->
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- Neural Connection Lines -->
  <path d="M 100 80 L 250 180 L 450 100 L 700 220 L 880 90" stroke="#00E5FF" stroke-width="1" opacity="0.25" stroke-dasharray="4 4"/>
  <path d="M 150 240 L 380 70 L 620 190 L 820 50" stroke="#8B5CF6" stroke-width="1" opacity="0.2" stroke-dasharray="6 3"/>

  <!-- Floating Particles Node Field -->
  <g filter="url(#pGlow)">
    <!-- Cyan Nodes -->
    <circle class="p-node p-pulse" cx="100" cy="80" r="5" fill="#00E5FF"/>
    <circle class="p-node-2" cx="250" cy="180" r="4" fill="#00E5FF"/>
    <circle class="p-node" cx="450" cy="100" r="6" fill="#00E5FF"/>
    <circle class="p-node-2 p-pulse" cx="700" cy="220" r="5" fill="#00E5FF"/>
    <circle class="p-node" cx="880" cy="90" r="4" fill="#00E5FF"/>

    <!-- Purple Nodes -->
    <circle class="p-node-2 p-pulse" cx="150" cy="240" r="6" fill="#8B5CF6"/>
    <circle class="p-node" cx="380" cy="70" r="4" fill="#8B5CF6"/>
    <circle class="p-node-2" cx="620" cy="190" r="5" fill="#8B5CF6"/>
    <circle class="p-node p-pulse" cx="820" cy="50" r="6" fill="#8B5CF6"/>

    <!-- Pink Sparkles -->
    <circle class="p-node" cx="300" cy="220" r="3" fill="#FF3CAC"/>
    <circle class="p-node-2" cx="550" cy="60" r="4" fill="#FF3CAC"/>
    <circle class="p-node p-pulse" cx="780" cy="250" r="4" fill="#FF3CAC"/>
  </g>
</svg>
