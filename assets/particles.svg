<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="auto">
  <defs>
    <linearGradient id="p-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B28DFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p-pulse { animation: pPulse 3s ease-in-out infinite alternate; }
    @keyframes pPulse { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }
  </style>
  <g class="p-pulse">
    <line x1="100" y1="40" x2="1100" y2="40" stroke="url(#p-grad)" stroke-width="1.5" stroke-dasharray="8,6"/>
    <circle cx="300" cy="40" r="4" fill="#4F8CFF"/>
    <circle cx="600" cy="40" r="5" fill="#7C5CFF"/>
    <circle cx="900" cy="40" r="4" fill="#B28DFF"/>
  </g>
</svg>