<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="100%" height="100%">
  <defs>
    <!-- Dark AI Lab Palette & Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E" />
      <stop offset="50%" stop-color="#080E1C" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF">
        <animate attributeName="stop-color" values="#4F8CFF; #7C5CFF; #B28DFF; #4F8CFF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7C5CFF">
        <animate attributeName="stop-color" values="#7C5CFF; #B28DFF; #4F8CFF; #7C5CFF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#B28DFF">
        <animate attributeName="stop-color" values="#B28DFF; #4F8CFF; #7C5CFF; #B28DFF" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="volumetricLight1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#04070E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="volumetricLight2" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#04070E" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0)" />
      <stop offset="50%" stop-color="rgba(178, 141, 255, 0.6)" />
      <stop offset="100%" stop-color="rgba(79, 140, 255, 0)" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace, Consolas, monospace; }

      /* Keyframe Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }

      @keyframes pulseLight {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.24; }
      }

      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(320px); opacity: 0; }
      }

      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes nodePulse {
        0%, 100% { r: 3px; opacity: 0.4; }
        50% { r: 6px; opacity: 0.9; }
      }

      @keyframes lineDash {
        to { stroke-dashoffset: -40; }
      }

      .floating-card { animation: floatSlow 6s ease-in-out indefinite; }
      .ambient-pulse { animation: pulseLight 7s ease-in-out indefinite; }
      .scanner-line { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) indefinite; }
      .blinking-cursor { animation: blinkCursor 1s step-end indefinite; }
      .node-dot { animation: nodePulse 3s ease-in-out indefinite; }
      .circuit-line { stroke-dasharray: 6 4; animation: lineDash 15s linear indefinite; }

      /* Typing Animation Steps */
      .type-line-1 { animation: fadeIn 0.5s 0.2s forwards; opacity: 0; }
      .type-line-2 { animation: fadeIn 0.5s 0.8s forwards; opacity: 0; }
      .type-line-3 { animation: fadeIn 0.5s 1.4s forwards; opacity: 0; }
      .type-line-4 { animation: fadeIn 0.5s 2.0s forwards; opacity: 0; }
      .type-line-5 { animation: fadeIn 0.5s 2.6s forwards; opacity: 0; }
      .type-ready  { animation: fadeIn 0.5s 3.2s forwards; opacity: 0; }
      .type-user   { animation: fadeIn 0.5s 3.8s forwards; opacity: 0; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
      <clipPath id="avatarClip">
      <rect width="300" height="320" rx="16" />
    </clipPath>
  </defs>

  <!-- Base Background Container -->
  <rect width="1400" height="700" rx="40" fill="url(#bgGradient)" stroke="url(#glassBorder)" stroke-width="1.5" />

  <!-- Ambient Volumetric Lighting -->
  <circle cx="250" cy="200" r="400" fill="url(#volumetricLight1)" class="ambient-pulse" />
  <circle cx="1150" cy="350" r="450" fill="url(#volumetricLight2)" class="ambient-pulse" />

  <!-- Subtle AI Grid Lines Background -->
  <g opacity="0.04" stroke="#4F8CFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1400" height="700" fill="url(#grid)" />
  </g>

  <!-- Floating Ambient Particles -->
  <g fill="#B28DFF">
    <circle cx="120" cy="140" r="1.5" opacity="0.4">
      <animate attributeName="cy" values="140;120;140" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="80" r="2" opacity="0.6">
      <animate attributeName="cy" values="80;65;80" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="180" r="1.5" opacity="0.5">
      <animate attributeName="cy" values="180;165;180" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="100" r="2" opacity="0.7">
      <animate attributeName="cy" values="100;80;100" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1300" cy="220" r="1.5" opacity="0.3">
      <animate attributeName="cy" values="220;200;220" dur="6.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- LEFT PANEL: Terminal & AI Core Log -->
  <g transform="translate(60, 110)">
    <!-- Terminal Glass Card -->
    <rect width="410" height="480" rx="24" fill="rgba(10, 18, 36, 0.65)" stroke="url(#glassBorder)" stroke-width="1.5" style="backdrop-filter: blur(20px);" />
    
    <!-- Terminal Header -->
    <rect width="410" height="42" rx="24" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="28" cy="21" r="5.5" fill="#FF5F56" opacity="0.8" />
    <circle cx="46" cy="21" r="5.5" fill="#FFBD2E" opacity="0.8" />
    <circle cx="64" cy="21" r="5.5" fill="#27C93F" opacity="0.8" />
    <text x="205" y="26" text-anchor="middle" class="font-mono" fill="#94A3B8" font-size="12" font-weight="500" letter-spacing="1">ai-core-terminal v4.2</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 75)" class="font-mono" font-size="12">
      <!-- Boot Logs -->
      <g fill="#94A3B8">
        <text y="0" class="type-line-1"><tspan fill="#4F8CFF">system@ai-lab:~#</tspan> init --core</text>
        <text y="24" class="type-line-2"><tspan fill="#7C5CFF">✓</tspan> Initializing AI Core...</text>
        <text y="48" class="type-line-3"><tspan fill="#7C5CFF">✓</tspan> Loading Neural Networks...</text>
        <text y="72" class="type-line-4"><tspan fill="#7C5CFF">✓</tspan> Loading Agentic Models...</text>
        <text y="96" class="type-line-5"><tspan fill="#7C5CFF">✓</tspan> Loading Project Repositories...</text>
        <text y="124" class="type-ready" font-weight="600"><tspan fill="#27C93F">● STATUS:</tspan> AI System Online &amp; Ready</text>
      </g>

      <line x1="0" y1="145" x2="362" y2="145" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

      <!-- User Profile Output -->
      <g transform="translate(0, 170)" class="type-user">
        <text y="0"><tspan fill="#4F8CFF">$ whoami</tspan></text>
        <text y="26" fill="#F8FAFC" font-size="14" font-weight="600">Vishal Rathod</text>
        <text y="48" fill="#B28DFF" font-size="12">AI &amp; Machine Learning Engineer</text>

        <!-- Skill Badges in Terminal -->
        <g transform="translate(0, 70)">
          <rect x="0" y="0" width="105" height="22" rx="6" fill="rgba(79, 140, 255, 0.12)" stroke="rgba(79, 140, 255, 0.3)" />
          <text x="52" y="15" text-anchor="middle" fill="#4F8CFF" font-size="10">Deep Learning</text>

          <rect x="113" y="0" width="105" height="22" rx="6" fill="rgba(124, 92, 255, 0.12)" stroke="rgba(124, 92, 255, 0.3)" />
          <text x="165" y="15" text-anchor="middle" fill="#7C5CFF" font-size="10">Generative AI</text>

          <rect x="226" y="0" width="105" height="22" rx="6" fill="rgba(178, 141, 255, 0.12)" stroke="rgba(178, 141, 255, 0.3)" />
          <text x="278" y="15" text-anchor="middle" fill="#B28DFF" font-size="10">Agentic AI</text>
        </g>

        <!-- Current Mission -->
        <g transform="translate(0, 120)">
          <text y="0" fill="#94A3B8" font-size="10" letter-spacing="1">CURRENT MISSION</text>
          <text y="20" fill="#CBD5E1" font-size="11" font-family="'Inter', sans-serif">"Building intelligent AI systems that</text>
          <text y="36" fill="#CBD5E1" font-size="11" font-family="'Inter', sans-serif">solve real-world problems."</text>
        </g>
      </g>

      <!-- Active Cursor -->
      <rect x="75" y="170" width="7" height="14" fill="#4F8CFF" class="blinking-cursor" />
    </g>
  </g>

  <!-- CENTER PANEL: Hero Typography & Identity -->
  <g transform="translate(700, 270)" text-anchor="middle">
    <!-- Ambient Behind Center Text -->
    <ellipse cx="0" cy="40" rx="220" ry="80" fill="url(#volumetricLight1)" filter="url(#accentGlow)" />

    <!-- Top Tagline -->
    <g transform="translate(0, -60)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="url(#glassBorder)" stroke-width="1" />
      <text y="4" class="font-mono" fill="#4F8CFF" font-size="11" font-weight="500" letter-spacing="3">RESEARCH &amp; DEVELOPMENT</text>
    </g>

    <!-- Main Name (Gradient + Soft Glow) -->
    <text y="45" class="font-sans" font-size="58" font-weight="900" letter-spacing="6" fill="url(#primaryGradient)" filter="url(#softGlow)">
      VISHAL RATHOD
    </text>
    <text y="45" class="font-sans" font-size="58" font-weight="900" letter-spacing="6" fill="url(#primaryGradient)">
      VISHAL RATHOD
    </text>

    <!-- Primary Title -->
    <text y="92" class="font-sans" fill="#F8FAFC" font-size="20" font-weight="600" letter-spacing="8" opacity="0.95">
      AI ENGINEER
    </text>

    <!-- Subtitle Bullet Track -->
    <g transform="translate(0, 130)" class="font-mono" fill="#94A3B8" font-size="12" letter-spacing="1">
      <text y="0">
        <tspan fill="#4F8CFF">LLMs</tspan>  •  
        <tspan fill="#7C5CFF">Agentic Workflows</tspan>  •  
        <tspan fill="#B28DFF">MLOps</tspan>
      </text>
    </g>

    <!-- Action / Status Pill -->
    <g transform="translate(0, 180)">
      <rect x="-160" y="-18" width="320" height="36" rx="18" fill="rgba(79, 140, 255, 0.08)" stroke="rgba(79, 140, 255, 0.25)" stroke-width="1" />
      <circle cx="-135" cy="0" r="4" fill="#27C93F">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="10" y="4" class="font-sans" fill="#E2E8F0" font-size="12" font-weight="500" letter-spacing="1">LOCATION: INDIA  |  AVAILABLE FOR AI LABS</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Futuristic AI Hologram & Avatar Viewport -->
  <g transform="translate(940, 110)">
    <!-- Outer Holographic Glass Frame -->
    <rect width="400" height="480" rx="24" fill="rgba(10, 18, 36, 0.6)" stroke="url(#glassBorder)" stroke-width="1.5" style="backdrop-filter: blur(20px);" />

    <!-- Top Viewport Bar -->
    <rect width="400" height="42" rx="24" fill="rgba(255, 255, 255, 0.03)" />
    <text x="28" y="26" class="font-mono" fill="#94A3B8" font-size="11" font-weight="500" letter-spacing="1.5">NEURAL PROFILE // VISUALIZER</text>
    <circle cx="368" cy="21" r="4" fill="#4F8CFF" />

    <!-- Avatar Viewport Box -->
    <g transform="translate(30, 65)">
      <!-- Background Neural Net Grid Lines -->
      <path d="M 40,40 L 170,120 L 300,40 M 170,120 L 170,280 M 40,280 L 170,120 L 300,280" stroke="#7C5CFF" stroke-opacity="0.25" stroke-width="1.5" class="circuit-line" />

      <!-- Interactive Neural Nodes -->
      <circle cx="40" cy="40" r="4" fill="#4F8CFF" class="node-dot" />
      <circle cx="170" cy="120" r="5" fill="#7C5CFF" class="node-dot" />
      <circle cx="300" cy="40" r="4" fill="#B28DFF" class="node-dot" />
      <circle cx="40" cy="280" r="4" fill="#B28DFF" class="node-dot" />
      <circle cx="170" cy="280" r="5" fill="#4F8CFF" class="node-dot" />
      <circle cx="300" cy="280" r="4" fill="#7C5CFF" class="node-dot" />

      <!-- Profile Image Clip Container -->
      <g transform="translate(20, 20)">
        <!-- Base Viewport Box -->
        <rect width="300" height="320" rx="16" fill="#070D1B" stroke="rgba(124, 92, 255, 0.35)" stroke-width="1.5" />

        <!-- Ambient Volumetric Glow behind Avatar -->
        <circle cx="150" cy="140" r="100" fill="url(#volumetricLight2)" opacity="0.6" />
        <circle cx="150" cy="130" r="85" fill="none" stroke="#4F8CFF" stroke-width="1.5" stroke-dasharray="6 4" class="circuit-line" />
        <circle cx="150" cy="130" r="65" fill="none" stroke="#7C5CFF" stroke-width="1" opacity="0.5" />

        <!-- Vector Sci-Fi AI Silhouette & Neural Mesh -->
        <g transform="translate(0, 10)">
          <!-- Shoulders & Torso -->
          <path d="M 45,300 C 60,225 105,200 150,200 C 195,200 240,225 255,300 Z" fill="url(#primaryGradient)" opacity="0.75" />
          <path d="M 75,300 L 150,220 L 225,300" fill="none" stroke="#B28DFF" stroke-width="1.5" opacity="0.6" />

          <!-- Neck -->
          <path d="M 132,170 L 168,170 L 164,200 L 136,200 Z" fill="#0A1224" stroke="#7C5CFF" stroke-width="1.5" />

          <!-- Head Structure -->
          <path d="M 105,125 C 105,70 195,70 195,125 C 195,175 105,175 105,125 Z" fill="#091020" stroke="#4F8CFF" stroke-width="2" />
          
          <!-- Glowing Futuristic AI Visor -->
          <path d="M 112,118 Q 150,106 188,118 Q 188,136 150,140 Q 112,136 112,118 Z" fill="#4F8CFF" filter="url(#softGlow)" opacity="0.95" />
          <path d="M 118,124 Q 150,116 182,124" fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" />

          <!-- Facial Neural Mesh Points -->
          <circle cx="130" cy="100" r="2.5" fill="#B28DFF" />
          <circle cx="170" cy="100" r="2.5" fill="#B28DFF" />
          <circle cx="150" cy="90" r="3" fill="#4F8CFF" />
          <circle cx="150" cy="155" r="2.5" fill="#7C5CFF" />

          <line x1="130" y1="100" x2="150" y2="90" stroke="#7C5CFF" stroke-width="1" opacity="0.5" />
          <line x1="170" y1="100" x2="150" y2="90" stroke="#7C5CFF" stroke-width="1" opacity="0.5" />
          <line x1="130" y1="100" x2="112" y2="118" stroke="#4F8CFF" stroke-width="1" opacity="0.5" />
          <line x1="170" y1="100" x2="188" y2="118" stroke="#4F8CFF" stroke-width="1" opacity="0.5" />
        </g>

        <!-- Holographic Top-to-Bottom Scanline Beam -->
        <rect width="300" height="45" fill="url(#scanlineGrad)" class="scanner-line" clip-path="url(#avatarClip)" />
        
        <!-- Tech Viewport Corner Accents -->
        <path d="M 0,20 L 0,0 L 20,0" fill="none" stroke="#4F8CFF" stroke-width="2.5" />
        <path d="M 280,0 L 300,0 L 300,20" fill="none" stroke="#4F8CFF" stroke-width="2.5" />
        <path d="M 0,300 L 0,320 L 20,320" fill="none" stroke="#7C5CFF" stroke-width="2.5" />
        <path d="M 280,320 L 300,320 L 300,300" fill="none" stroke="#7C5CFF" stroke-width="2.5" />
      </g>

      <!-- Subtitle Stats below Hologram -->
      <g transform="translate(20, 365)" class="font-mono" font-size="11" fill="#94A3B8">
        <text x="0" y="0">MODEL: <tspan fill="#F8FAFC">GEN-AI / AGENTIC</tspan></text>
        <text x="180" y="0">LATENCY: <tspan fill="#27C93F">12ms</tspan></text>
        <text x="0" y="20">CORE: <tspan fill="#4F8CFF">PYTORCH / CUDA</tspan></text>
        <text x="180" y="20">ACCURACY: <tspan fill="#B28DFF">99.8%</tspan></text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Light Divider -->
  <line x1="100" y1="650" x2="1300" y2="650" stroke="url(#primaryGradient)" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8 6" />
</svg>