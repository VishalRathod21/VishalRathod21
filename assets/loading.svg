<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;display=swap');
      .mono { font-family: 'Fira Code', monospace; }
      @keyframes spinCore { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .spinner { transform-origin: 400px 80px; animation: spinCore 4s linear infinite; }
      .txtPulse { animation: pulseText 2s infinite ease-in-out; }
    </style>
    <linearGradient id="loadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#B28DFF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="20" fill="#04070E"/>
  <g class="spinner">
    <circle cx="400" cy="80" r="35" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4"/>
    <circle cx="400" cy="80" r="35" fill="none" stroke="url(#loadGrad)" stroke-width="4" stroke-dasharray="160" stroke-dashoffset="60" stroke-linecap="round"/>
  </g>
  <text x="400" y="150" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle" class="mono txtPulse">INITIALIZING AI RESEARCH CORE...</text>
</svg>