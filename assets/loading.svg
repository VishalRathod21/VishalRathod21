<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Bar Fill Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      fill: #00E5FF;
      letter-spacing: 1px;
    }
    .percent-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #FF3CAC;
    }
    .progress-bar {
      animation: loadProgress 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .glow-dot {
      animation: moveDot 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pulse-text {
      animation: pulseOpacity 1.5s ease-in-out infinite alternate;
    }

    @keyframes loadProgress {
      0% { width: 0px; }
      20% { width: 150px; }
      50% { width: 420px; }
      80% { width: 650px; }
      100% { width: 720px; }
    }

    @keyframes moveDot {
      0% { transform: translateX(0px); }
      20% { transform: translateX(150px); }
      50% { transform: translateX(420px); }
      80% { transform: translateX(650px); }
      100% { transform: translateX(720px); }
    }

    @keyframes pulseOpacity {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="796" height="116" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Terminal Header -->
  <g transform="translate(40, 36)">
    <circle cx="0" cy="0" r="4" fill="#FF3CAC"/>
    <circle cx="14" cy="0" r="4" fill="#8B5CF6"/>
    <circle cx="28" cy="0" r="4" fill="#00E5FF"/>
    <text x="46" y="5" class="terminal-text pulse-text">&gt; INITIALIZING VISHAL_RATHOD_AI_OS.SYS</text>
    <text x="680" y="5" class="percent-text" text-anchor="end">100%</text>
  </g>

  <!-- Progress Bar Track -->
  <rect x="40" y="60" width="720" height="18" rx="9" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>

  <!-- Progress Bar Fill -->
  <rect class="progress-bar" x="40" y="60" width="720" height="18" rx="9" fill="url(#barGrad)" filter="url(#neonGlow)"/>

  <!-- Leading Glow Head -->
  <g class="glow-dot" transform="translate(40, 0)">
    <circle cx="0" cy="69" r="11" fill="#FFFFFF" opacity="0.9" filter="url(#neonGlow)"/>
    <circle cx="0" cy="69" r="6" fill="#00E5FF"/>
  </g>

  <!-- Sub-status -->
  <text x="40" y="102" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" letter-spacing="0.5">
    STATUS: <tspan fill="#00E5FF">AUTHENTICATED</tspan> | CORE_VERSION: <tspan fill="#8B5CF6">v4.2.0-PROD</tspan> | AGENTIC_PIPELINE: <tspan fill="#FF3CAC">READY</tspan>
  </text>
</svg>
