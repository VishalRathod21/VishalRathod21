<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="footBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .term-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #00E5FF;
      letter-spacing: 1px;
    }
    .code-keyword {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #FF3CAC;
    }
    .code-func {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      fill: #00E5FF;
    }
    .code-paren {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      fill: #F8FAFC;
    }
    .cursor-blink {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .status-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #94A3B8;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="796" height="156" rx="14" fill="url(#footBg)" stroke="url(#footBorder)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <g transform="translate(30, 28)">
    <circle cx="0" cy="0" r="4" fill="#FF3CAC"/>
    <circle cx="12" cy="0" r="4" fill="#8B5CF6"/>
    <circle cx="24" cy="0" r="4" fill="#00E5FF"/>
    <text x="38" y="4" class="term-header">&gt; TERMINAL_EXECUTE // PERPETUAL_LOOP.SH</text>
  </g>

  <!-- Code Loop Body -->
  <g transform="translate(40, 62)">
    <text x="0" y="0"><tspan class="code-keyword">while</tspan> <tspan class="code-paren">(</tspan><tspan fill="#8B5CF6" font-weight="700">alive</tspan><tspan class="code-paren">) {</tspan></text>
    <text x="24" y="22"><tspan class="code-func">learn</tspan><tspan class="code-paren">();</tspan></text>
    <text x="24" y="42"><tspan class="code-func">build</tspan><tspan class="code-paren">();</tspan></text>
    <text x="24" y="62"><tspan class="code-func">share</tspan><tspan class="code-paren">();</tspan></text>
    <text x="24" y="82"><tspan class="code-func">repeat</tspan><tspan class="code-paren">();</tspan></text>
    <text x="0" y="82" dx="116"><tspan class="code-paren">}</tspan> <rect class="cursor-blink" x="12" y="-12" width="8" height="16" fill="#00E5FF" filter="url(#neonGlow)"/></text>
  </g>

  <!-- Right Footer Metadata -->
  <g transform="translate(760, 80)">
    <text x="0" y="0" class="status-tag" text-anchor="end">SYSTEM STATUS: <tspan fill="#00E5FF" font-weight="700">ONLINE [99.99%]</tspan></text>
    <text x="0" y="18" class="status-tag" text-anchor="end">LOCATION: <tspan fill="#8B5CF6" font-weight="700">INDIA 🇮🇳</tspan> | DAVV M.TECH</text>
    <text x="0" y="36" class="status-tag" text-anchor="end">DEVELOPER: <tspan fill="#FF3CAC" font-weight="700">VISHAL RATHOD</tspan></text>
  </g>
</svg>
