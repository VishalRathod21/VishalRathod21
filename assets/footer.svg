<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E" />
      <stop offset="100%" stop-color="#0A1224" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8CFF" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Inter:wght@400;600&amp;display=swap');
      
      .font-mono { font-family: 'Fira Code', monospace; }
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .blinking-cursor { animation: blinkCursor 1s step-end indefinite; }
      .pulse-dot { animation: pulseDot 2s ease-in-out indefinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="220" rx="24" fill="url(#bgGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Top Accent Beam -->
  <rect width="1200" height="3" rx="1.5" fill="url(#primaryGrad)" />

  <!-- Terminal Window Content -->
  <g transform="translate(60, 45)">
    <!-- Code Loop Container -->
    <g class="font-mono" font-size="15" fill="#F8FAFC">
      <text x="0" y="0"><tspan fill="#7C5CFF" font-weight="700">while</tspan> (<tspan fill="#4F8CFF">alive</tspan>) {</text>
      <text x="32" y="28"><tspan fill="#B28DFF">learn</tspan>();</text>
      <text x="32" y="56"><tspan fill="#4F8CFF">build</tspan>();</text>
      <text x="32" y="84"><tspan fill="#7C5CFF">share</tspan>();</text>
      <text x="32" y="112"><tspan fill="#27C93F">repeat</tspan>();</text>
      <text x="0" y="140">}</text>

      <!-- Active Cursor on Last Line -->
      <rect x="15" y="126" width="9" height="18" fill="#4F8CFF" class="blinking-cursor" />
    </g>

    <!-- Right Side Status Badge -->
    <g transform="translate(750, 40)">
      <rect x="0" y="0" width="330" height="60" rx="14" fill="rgba(10, 18, 36, 0.7)" stroke="url(#cardBorder)" stroke-width="1.5" />
      <circle cx="28" cy="30" r="6" fill="#27C93F" class="pulse-dot" />
      <text x="46" y="28" class="font-mono" fill="#F8FAFC" font-size="12" font-weight="700">SYSTEM STATUS: OPERATIONAL</text>
      <text x="46" y="46" class="font-mono" fill="#94A3B8" font-size="11">CONTINUOUS LEARNING LOOP ACTIVE</text>
    </g>
  </g>
</svg>
