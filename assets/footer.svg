<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070E"/>
      <stop offset="100%" stop-color="#0A1224"/>
    </linearGradient>

    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(10, 18, 36, 0.9)"/>
      <stop offset="100%" stop-color="rgba(4, 7, 14, 0.95)"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(178, 141, 255, 0.2)"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&amp;family=Inter:wght@600;700&amp;display=swap');
    text { font-family: 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, sans-serif; }

    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .loop-text {
      animation: glowText 4s infinite alternate;
    }
    @keyframes glowText {
      0% { text-shadow: 0 0 4px rgba(79, 140, 255, 0.2); }
      100% { text-shadow: 0 0 12px rgba(178, 141, 255, 0.6); }
    }
  </style>

  <!-- Outer Glass Frame -->
  <rect width="900" height="260" rx="24" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <g transform="translate(30, 25)">
    <!-- Terminal Window -->
    <rect width="840" height="210" rx="16" fill="url(#glass-card)" stroke="url(#card-border)" stroke-width="1.5"/>
    <rect x="1" y="1" width="838" height="208" rx="15" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- Terminal Header Bar -->
    <rect width="840" height="38" rx="16" fill="rgba(255,255,255,0.03)"/>
    <line x1="0" y1="38" x2="840" y2="38" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <circle cx="20" cy="19" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="19" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="19" r="5" fill="#27C93F"/>
    
    <text x="420" y="24" fill="#94A3B8" font-size="11" font-weight="600" text-anchor="middle">life-loop.cpp — AI Executive Directive</text>

    <!-- Code Content -->
    <g transform="translate(40, 68)" font-size="14" font-weight="600">
      <text x="0" y="0" fill="#7C5CFF">while <tspan fill="#F8FAFC">(alive) {</tspan></text>
      
      <g transform="translate(30, 26)">
        <text x="0" y="0" fill="#4F8CFF" class="loop-text">learn<tspan fill="#F8FAFC">();</tspan></text>
        <text x="180" y="0" fill="#94A3B8" class="sans" font-size="11">// Continuously acquire new AI &amp; ML knowledge</text>
      </g>

      <g transform="translate(30, 52)">
        <text x="0" y="0" fill="#B28DFF" class="loop-text">build<tspan fill="#F8FAFC">();</tspan></text>
        <text x="180" y="0" fill="#94A3B8" class="sans" font-size="11">// Ship high-impact intelligent products</text>
      </g>

      <g transform="translate(30, 78)">
        <text x="0" y="0" fill="#4F8CFF" class="loop-text">share<tspan fill="#F8FAFC">();</tspan></text>
        <text x="180" y="0" fill="#94A3B8" class="sans" font-size="11">// Empower open-source developer communities</text>
      </g>

      <g transform="translate(30, 104)">
        <text x="0" y="0" fill="#7C5CFF" class="loop-text">repeat<tspan fill="#F8FAFC">();</tspan></text>
        <text x="180" y="0" fill="#94A3B8" class="sans" font-size="11">// Iterate relentlessly towards perfection</text>
      </g>

      <text x="0" y="128" fill="#F8FAFC">}</text>
      <rect x="25" y="115" width="8" height="16" fill="#4F8CFF" class="cursor"/>
    </g>
  </g>
</svg>