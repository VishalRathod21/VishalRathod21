<svg width="360" height="520" viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&amp;family=Poppins:wght@600;700&amp;display=swap');
    .pname { font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; fill:#ffffff; }
    .prole { font-family:'Fira Code',monospace; font-size:13px; fill:#e6b3ff; }
    .phand { font-family:'Fira Code',monospace; font-size:12px; fill:#7ee7ff; }
    .strap { font-family:'Poppins',sans-serif; font-weight:600; font-size:11px; fill:#ffffff; }
  </style>

  <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#c06bff"/>
  </linearGradient>

  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a1030"/>
    <stop offset="100%" stop-color="#120a22"/>
  </linearGradient>

  <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="55%" stop-color="#7ee7ff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
    <stop offset="70%" stop-color="#c06bff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#c06bff" stop-opacity="0.55"/>
  </radialGradient>

  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
  </filter>

  <clipPath id="cardClip"><rect x="-78" y="34" width="156" height="220" rx="16"/></clipPath>
  <clipPath id="faceClip"><circle cx="0" cy="112" r="38"/></clipPath>
</defs>

<rect width="360" height="520" fill="transparent"/>

<!-- pivot + swinging assembly -->
<g transform="translate(180,-40)">
  <animateTransform attributeName="transform" type="translate" values="180,-260;180,-40" dur="1s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.34 1.2 0.64 1"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0;0;16;-11;7;-4.5;2.5;-1.2;0.6;0;0"
      keyTimes="0;0.1;0.20;0.32;0.44;0.56;0.68;0.78;0.87;0.94;1"
      dur="14s" begin="1.0s" repeatCount="indefinite"/>

    <!-- strap -->
    <rect x="-9" y="0" width="18" height="120" fill="url(#strapGrad)"/>
    <text class="strap" x="0" y="60" text-anchor="middle" transform="rotate(90 0 60)">VISHAL · AI &amp; DATA SCIENCE</text>

    <!-- clasp -->
    <rect x="-15" y="112" width="30" height="18" rx="6" fill="#c9c9d6"/>
    <circle cx="0" cy="132" r="9" fill="none" stroke="#c9c9d6" stroke-width="4"/>

    <!-- card -->
    <g transform="translate(0,150)" filter="url(#softShadow)">
      <rect x="-90" y="0" width="180" height="270" rx="20" fill="url(#cardGrad)" stroke="#3a2a5c"/>
      <rect x="-90" y="0" width="180" height="270" rx="20" fill="none" stroke="#7c8bff" stroke-opacity="0.25"/>

      <!-- header strip -->
      <rect x="-90" y="0" width="180" height="26" rx="20" fill="#241638"/>
      <rect x="-90" y="14" width="180" height="12" fill="#241638"/>
      <text x="0" y="18" text-anchor="middle" class="phand" fill="#8b949e" font-size="10">DEVELOPER ID</text>

      <!-- avatar ring + face -->
      <circle cx="0" cy="112" r="44" fill="url(#ringGlow)"/>
      <circle cx="0" cy="112" r="40" fill="none" stroke="#ff6ec7" stroke-width="2.5"/>
      <g clip-path="url(#faceClip)">
        <image href="https://github.com/VishalRathod21.png?size=200" x="-38" y="74" width="76" height="76" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <circle cx="0" cy="112" r="40" fill="none" stroke="#7ee7ff" stroke-width="1" opacity="0.6"/>

      <text class="pname" x="0" y="178" text-anchor="middle">Vishal Rathod</text>
      <text class="prole" x="0" y="198" text-anchor="middle">AI &amp; ML Engineer</text>
      <text class="phand" x="0" y="216" text-anchor="middle">@VishalRathod21</text>

      <!-- barcode -->
      <g transform="translate(-70,232)" fill="#c9c9d6">
        <rect x="0" y="0" width="2" height="26"/><rect x="4" y="0" width="1" height="26"/><rect x="7" y="0" width="3" height="26"/>
        <rect x="12" y="0" width="1" height="26"/><rect x="15" y="0" width="2" height="26"/><rect x="19" y="0" width="1" height="26"/>
        <rect x="22" y="0" width="3" height="26"/><rect x="27" y="0" width="1" height="26"/><rect x="30" y="0" width="2" height="26"/>
        <rect x="34" y="0" width="1" height="26"/><rect x="37" y="0" width="3" height="26"/><rect x="42" y="0" width="1" height="26"/>
        <rect x="45" y="0" width="2" height="26"/><rect x="49" y="0" width="1" height="26"/><rect x="52" y="0" width="3" height="26"/>
        <rect x="57" y="0" width="1" height="26"/><rect x="60" y="0" width="2" height="26"/><rect x="64" y="0" width="1" height="26"/>
        <rect x="67" y="0" width="3" height="26"/><rect x="72" y="0" width="1" height="26"/><rect x="75" y="0" width="2" height="26"/>
        <rect x="79" y="0" width="1" height="26"/><rect x="82" y="0" width="3" height="26"/><rect x="87" y="0" width="1" height="26"/>
        <rect x="90" y="0" width="2" height="26"/><rect x="94" y="0" width="1" height="26"/><rect x="97" y="0" width="3" height="26"/>
        <rect x="102" y="0" width="1" height="26"/><rect x="105" y="0" width="2" height="26"/><rect x="109" y="0" width="1" height="26"/>
        <rect x="112" y="0" width="3" height="26"/><rect x="117" y="0" width="1" height="26"/><rect x="120" y="0" width="2" height="26"/>
        <rect x="124" y="0" width="1" height="26"/><rect x="127" y="0" width="3" height="26"/><rect x="132" y="0" width="1" height="26"/>
        <rect x="135" y="0" width="2" height="26"/><rect x="139" y="0" width="1" height="26"/>
      </g>

      <!-- holographic shine sweep -->
      <g clip-path="url(#cardClip)">
        <rect x="-160" y="0" width="90" height="270" fill="url(#shineGrad)" transform="rotate(20 0 135)">
          <animate attributeName="x" values="-200;260" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</g>
</svg>
