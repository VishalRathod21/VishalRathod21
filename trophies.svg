<svg width="980" height="180" viewBox="0 0 980 180" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&amp;family=Poppins:wght@600;700&amp;display=swap');
    .t-title { font-family:'Poppins',sans-serif; font-weight:700; font-size:13px; fill:#ffffff; }
    .t-rank  { font-family:'Fira Code',monospace; font-size:11px; fill:#7ee7ff; }
  </style>
  <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffd700"/>
    <stop offset="100%" stop-color="#ff9d00"/>
  </linearGradient>
  <filter id="tGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="980" height="180" rx="16" fill="#0d0817" stroke="#3a2a5c"/>

<!-- 5 trophy cells -->
<g font-family="Fira Code">
