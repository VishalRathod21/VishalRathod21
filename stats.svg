<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&amp;family=Poppins:wght@600;700&amp;display=swap');
    .title { font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; fill:#ffffff; }
    .lbl   { font-family:'Fira Code',monospace; font-size:13px; fill:#c9d1d9; }
    .val   { font-family:'Fira Code',monospace; font-size:13px; font-weight:600; fill:#7ee7ff; }
    .pct   { font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; fill:#ffffff; }
  </style>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#7c8bff"/>
  </linearGradient>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="100%" stop-color="#7c8bff"/>
  </linearGradient>
  <clipPath id="frameS"><rect width="480" height="200" rx="16"/></clipPath>
</defs>

<rect width="480" height="200" rx="16" fill="#0d0817" stroke="#3a2a5c"/>
<g clip-path="url(#frameS)">
<text class="title" x="20" y="32" opacity="0">Vishal's GitHub Stats
  <animate attributeName="opacity" to="1" dur="0.01s" begin="0.1s" fill="freeze"/>
</text>

<!-- rank ring -->
<g transform="translate(80,120)">
  <circle r="52" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
  <circle r="52" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
    stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="327" to="62" dur="1.6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
  </circle>
  <text class="pct" text-anchor="middle" y="6" opacity="0">A+
    <animate attributeName="opacity" to="1" dur="0.01s" begin="1.8s" fill="freeze"/>
  </text>
  <text class="lbl" text-anchor="middle" y="26" font-size="10" opacity="0">RANK
    <animate attributeName="opacity" to="1" dur="0.01s" begin="1.8s" fill="freeze"/>
  </text>
</g>

<!-- stat rows -->
<g transform="translate(190,58)">
  <g opacity="0" transform="translate(-40,0)">
    <animate attributeName="opacity" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,0" to="0,0" dur="0.5s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <text class="lbl" y="0">⭐  Total Stars Earned</text>
    <text class="val" x="250" y="0" text-anchor="end">128</text>
  </g>
  <g opacity="0" transform="translate(-40,0)">
    <animate attributeName="opacity" to="1" dur="0.5s" begin="0.85s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,32" to="0,32" dur="0.5s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <text class="lbl" y="32">📦  Total Commits</text>
    <text class="val" x="250" y="32" text-anchor="end">742</text>
  </g>
  <g opacity="0" transform="translate(-40,0)">
    <animate attributeName="opacity" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,64" to="0,64" dur="0.5s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <text class="lbl" y="64">🔀  Total PRs</text>
    <text class="val" x="250" y="64" text-anchor="end">36</text>
  </g>
  <g opacity="0" transform="translate(-40,0)">
    <animate attributeName="opacity" to="1" dur="0.5s" begin="1.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40,96" to="0,96" dur="0.5s" begin="1.35s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    <text class="lbl" y="96">🐛  Issues Closed</text>
    <text class="val" x="250" y="96" text-anchor="end">21</text>
  </g>
</g>
<text x="20" y="188" font-family="Fira Code" font-size="9" fill="#6e5a94">↳ static demo values — update to your real stats</text>
</g>
</svg>
