name: Profile Telemetry & Metrics Sync

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Sync Profile Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify Asset Integrity
        run: |
          echo "Checking profile asset integrity..."
          test -f assets/banner-dark.svg || exit 1
          test -f assets/banner-light.svg || exit 1
          test -f assets/lanyard.svg || exit 1
          test -f assets/skills.svg || exit 1
          test -f assets/stats.svg || exit 1
          test -f assets/timeline.svg || exit 1
          test -f assets/footer.svg || exit 1
          echo "All profile assets verified successfully!"
