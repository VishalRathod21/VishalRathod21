name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#7C5CFF&color_dots=#0A1224,#1E293B,#4F8CFF,#7C5CFF,#B28DFF
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7C5CFF&color_dots=#04070E,#0A1224,#4F8CFF,#7C5CFF,#B28DFF

      - name: Push Snake SVG to Repository
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
